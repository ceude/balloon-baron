<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>App Store v2</title>
<style>
@font-face { font-family: BC; src: url(../../../BalloonBaron/Fonts/BarlowCondensed-ExtraBold.ttf); font-weight: 800; }
@font-face { font-family: BC; src: url(../../../BalloonBaron/Fonts/BarlowCondensed-Bold.ttf); font-weight: 700; }
@font-face { font-family: BC; src: url(../../../BalloonBaron/Fonts/BarlowCondensed-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: B; src: url(../../../BalloonBaron/Fonts/Barlow-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: B; src: url(../../../BalloonBaron/Fonts/Barlow-Bold.ttf); font-weight: 700; }
/* Japanese and Korean: Noto Sans JP / KR (OFL, fonts/), variable weight; Barlow keeps the digits and Latin letters */
@font-face { font-family: NJ; src: url(fonts/NotoSansJP-VF.ttf); font-weight: 100 900; }
@font-face { font-family: NK; src: url(fonts/NotoSansKR-VF.ttf); font-weight: 100 900; }
html, body { margin: 0; background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../art.js"></script>
<script src="art2.js"></script>
<script src="captions.js"></script>
<script src="cities.js"></script>
<script>
/* The v2 App Store screens drawn as one wide sky, so the big balloons between them carry on from one screen to the
   next while you swipe; the sky runs from sunrise on screen 1 to night on screen 10. Each screen has its own layout
   (full-bleed art, tilted phones, two phones, a before/after split, close-ups and number badges), and every one shows
   real game screens captured by shots.js. render.js opens this page with
   ?dev=iphone|ipad&lang=tr&raw=<folder with <dev>/<scene>.png> and cuts the picture into screens. */
const q = new URLSearchParams(location.search), DEV = q.get('dev') || 'iphone', LANG = q.get('lang') || 'tr', RAW = q.get('raw');
const TXT = CAPTIONS[LANG];
/* figures read off the captured screens (captions.js `values`) go into the words: @IDLE, @FLEET, @DAY, @SHARE */
(function fill(o) { for (const k in o) { if (typeof o[k] === 'string') o[k] = o[k].replace(/@([A-Z]+)/g, (m, v) => (TXT.values || {})[v] ?? m); else if (o[k] && typeof o[k] === 'object') fill(o[k]); } })(TXT);
/* Type. Latin: Barlow Condensed ExtraBold headlines, Barlow Bold lines. Japanese and Korean: Noto Sans Black / Bold,
   set smaller (a CJK glyph fills its em, Barlow's capitals about 70% of it), with more leading and no tracking. */
const CJK = LANG === 'ja' ? 'NJ' : LANG === 'ko' ? 'NK' : null;
const TY = CJK ? {
  head: s => `900 ${s}px ${CJK}`, headK: .7, lh: 1.16, track: -.02, top: .9, sub: s => `700 ${s}px ${CJK}`, subK: .92,
  label: (w, s) => `${w} ${s}px BC, ${CJK}`, labelK: .9, labelTrack: .04,
} : {
  head: s => `800 ${s}px BC`, headK: 1, lh: .9, track: -.006, top: .75, sub: s => `700 ${s}px B`, subK: 1,
  label: (w, s) => `${w} ${s}px BC`, labelK: 1, labelTrack: .16,
};
const IPAD = DEV === 'ipad';
const D = IPAD
  ? { W: 2064, H: 2752, kind: 'ipad', cap: { y: .052, size: 196, maxW: 1800, sub: 82 } }
  : { W: 1320, H: 2868, kind: 'iphone', cap: { y: .058, size: 192, maxW: 1200, sub: 66 } };
const G = (phone, pad) => IPAD ? pad : phone; /* a value for each device */

/* The story, in App Store order. The first three sell the game on their own (search shows only those). */
const SCREENS = ['hero', 'cities', 'flight', 'idle', 'holding', 'crew', 'design', 'rivals', 'night', 'show'];
const N = SCREENS.length;
/* raw captures each device needs, by name (shots.js writes <dev>/<name>.png) */
let RAWS = ['home', 'world', 'flight', IPAD ? 'auto-run2' : 'auto-run3', 'early', 'empire', 'holding', 'crew', 'design', 'market', 'night', 'show-6', 'show-20'];
/* Pieces of real screens lifted out, in raw pixels [x, y, w, h] (lens: [cx, cy, r]). These are the prototype
   captures' (shots.js); captures from the app (store-shots.yml) bring their own in <raw>/shots.js (SHOTS below). */
let SRC = IPAD ? {
  bar: ['auto-run2', [740, 2200, 584, 86]], lens: ['flight', [732, 1668, 300]], hold: ['holding', [26, 28, 430, 112]],
  rows: ['crew', [24, 815, 1150, 290]], studio: ['design', [640, 436, 772, 418]], deal: ['market', [30, 1050, 2010, 420]],
} : {
  bar: ['auto-run3', [224, 1965, 840, 110]], lens: ['flight', [469, 1715, 330]], hold: ['holding', [44, 44, 1040, 170]],
  rows: ['crew', [56, 1338, 1184, 450]], studio: ['design', [108, 252, 1076, 618]], deal: ['market', [48, 1746, 1194, 790]],
};

const cv = document.getElementById('c');
cv.width = D.W * N; cv.height = D.H;
const ctx = cv.getContext('2d');
W = D.W * N; H = D.H;
const U = D.W; /* one screen */
let IMG = {};
/* which captured file stands for each picture the story needs (SHOTS can change it), and the night's crop */
let PICK = {}, NIGHT_CROP = [.13, .77], SHOTS_APP = false;

/* ---------- the sky across all screens: time of day by position ---------- */
/* stops: [u (screen units), [zenith, upper, lower, horizon]] */
const SKY = [
  [0, ['#141a4a', '#5a2c6a', '#f06a5a', '#ffc47a']],
  [1, ['#18164a', '#5a2c68', '#e8705e', '#ffc88a']],
  [3.4, ['#262a64', '#7a4a80', '#f09a78', '#ffdcae']],
  [5.4, ['#2a3070', '#8a5486', '#f4a477', '#ffd9a6']],
  [7.0, ['#1a1844', '#552c64', '#c4506a', '#ff9468']],
  [7.9, ['#0c0f2c', '#1a1d4c', '#3a2e66', '#7a4a74']],
  [9.0, ['#070a20', '#0e1438', '#1b2150', '#33305e']],
  [10, ['#070a20', '#0e1438', '#1b2150', '#33305e']],
];
const skyAt = u => sampleStops(SKY, u);
const nightK = u => clamp((u - 7.1) / 1.0, 0, 1);
function drawSky() {
  const step = 6;
  for (let x = 0; x < W; x += step) {
    const u = (x + step / 2) / U, [z, a, b, h] = skyAt(u);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, z); g.addColorStop(.36, a); g.addColorStop(.66, b); g.addColorStop(.86, h); g.addColorStop(1, h);
    ctx.fillStyle = g; ctx.fillRect(x, 0, step + 1, H);
  }
}
function drawStars() {
  const R = mulberry32(77);
  for (let i = 0; i < 1400; i++) {
    const x = R() * W, y = R() * H * .75, k = nightK(x / U) * (1 - y / (H * .8)), s = R();
    if (k <= .02) continue;
    ctx.fillStyle = `rgba(255,248,230,${k * (.25 + .6 * s)})`; ctx.beginPath(); ctx.arc(x, y, .8 + s * 1.8 * (U / 1320), 0, 7); ctx.fill();
  }
}
function drawMoon() {
  const mx = U * 9.84, my = H * .4, mr = U * .035;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; const mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 8); mg.addColorStop(0, 'rgba(200,210,255,.22)'); mg.addColorStop(1, 'rgba(200,210,255,0)'); ctx.fillStyle = mg; ctx.fillRect(mx - mr * 8, my - mr * 8, mr * 16, mr * 16); ctx.restore();
  /* a crescent, cut on its own little canvas so the sky shows through */
  const mc = document.createElement('canvas'); mc.width = mc.height = Math.ceil(mr * 2 + 4); const m = mc.getContext('2d'), o = mr + 2;
  m.fillStyle = '#fff6dc'; m.beginPath(); m.arc(o, o, mr, 0, 7); m.fill();
  m.globalCompositeOperation = 'destination-out'; m.beginPath(); m.arc(o + mr * .45, o - mr * .2, mr * .9, 0, 7); m.fill();
  ctx.drawImage(mc, mx - o, my - o);
}
function drawClouds() {
  const R = mulberry32(5);
  for (let i = 0; i < 60; i++) {
    const x = R() * W, y = H * (.12 + R() * .62), w = U * (.4 + R() * .7), h = w * (.05 + R() * .05), u = x / U;
    const [, a, b, hz] = skyAt(u), lit = mix(b, hz, .6), nk = nightK(u);
    const g = ctx.createRadialGradient(x, y, 0, x, y, w / 2);
    g.addColorStop(0, rgba(mix(lit, '#3a3a70', nk), .22 * (1 - nk * .5))); g.addColorStop(1, rgba(lit, 0));
    ctx.save(); ctx.translate(x, y); ctx.scale(1, h / (w / 2)); ctx.translate(-x, -y); ctx.fillStyle = g; ctx.fillRect(x - w / 2, y - w / 2, w, w); ctx.restore();
  }
}
const COLS = ['#ff5e3a', '#ffc23d', '#14a39a', '#9b7be0', '#e5432f', '#5aa9e6', '#22a45d', '#ff6fa8', '#3ad0c0', '#2b2350'];
/* screens with their own full picture skip the shared far balloons and ground */
const OWN = { cities: 1, night: 1 };
const own = u => OWN[SCREENS[Math.floor(u)]];
function drawFarBalloons() {
  const R = mulberry32(11), list = [];
  for (let i = 0; i < 260; i++) list.push({ x: R() * W, y: H * (.08 + R() * .7), d: R(), c: COLS[Math.floor(R() * COLS.length)], s: COLS[Math.floor(R() * COLS.length)], st: R() < .5 });
  list.sort((a, b) => a.d - b.d);
  for (const b of list) {
    const u = b.x / U, fx = u - Math.floor(u); if (own(u) || Math.floor(u) === 0) continue;
    if (b.y < H * .26 && fx > .06 && fx < .94) continue; /* nothing behind the words */
    const hz = skyAt(u)[2], nk = nightK(u), r = U * (.006 + .03 * Math.pow(b.d, 2.4));
    farBalloon(b.x, b.y, r, b.c, (1 - b.d) * .65 + nk * .3, mix(hz, '#1a1d4c', nk * .5), { stripe: b.st ? b.s : null, glow: nk * (R() < .55 ? 1 : .25) });
  }
}
/* fairy chimneys along the bottom, lit by the time of day; windows glow at night */
function drawGround() {
  ctx.save();
  const R = mulberry32(21);
  for (let layer = 0; layer < 2; layer++) {
    const base = H * (layer ? 1.0 : .97), n = layer ? 60 : 110;
    for (let i = 0; i < n; i++) {
      const x = R() * W, u = x / U; if (own(u) || u < 1) { R(); R(); continue; }
      const nk = nightK(u), [, , lo, hz] = skyAt(u), h = U * (layer ? .35 + R() * .25 : .14 + R() * .14);
      const lit = mix(mix('#e6a27a', hz, .3), '#3a3460', nk * .85), dark = mix('#5a2c3c', '#120e24', nk);
      chimney(x, base, h * .34, h, { seed: i * 7 + layer * 1000, light: 1, lit, dark, rim: mix('#ffd59a', '#8a90d0', nk), windows: layer ? 3 : 1, lamp: nk > .5, haze: layer ? 0 : .25 * (1 - nk), hazeColor: lo });
    }
  }
  ctx.restore();
}

/* ---------- the big balloons on the seams ---------- */
/* x in screens (an integer is a seam), y in heights, r in screen widths. */
const BIG = [
  { x: 1.0, y: .7, r: .15, cols: ['#ff5e3a', '#ffc23d'], pattern: 'band', pc: ['#2b2350', '#ffffff'], burn: 1, people: 5, layer: 'front' },
  { x: 2.0, y: .31, r: .12, cols: ['#5aa9e6', '#f2f8ff'], pattern: 'chevron', pc: ['#ffc23d', '#e5432f'], burn: .8, people: 3, layer: 'front' },
  { x: 3.0, y: .33, r: .13, cols: ['#9b7be0', '#f4eeff'], pattern: 'stars', pc: ['#2b2350', '#ffc23d'], burn: .9, people: 4, layer: 'front' },
  { x: 4.0, y: .3, r: .12, cols: ['#e5432f', '#ffffff'], pattern: 'diamond', pc: ['#ffc23d', '#2b2350'], burn: .8, layer: 'front' },
  { x: 5.0, y: .89, r: .11, cols: ['#22a45d', '#fff3b0'], pattern: 'rings', pc: ['#ffffff', '#e5432f'], burn: .9, people: 3, layer: 'front' },
  { x: 6.0, y: .31, r: .12, cols: ['#ff6fa8', '#fff0f6'], pattern: 'band', pc: ['#9b7be0', '#ffffff'], burn: .7, layer: 'front' },
  { x: 7.0, y: .32, r: .13, cols: ['#2b2350', '#ffc23d'], pattern: 'sun', pc: ['#ffc23d', '#ff5e3a'], burn: 1, people: 4, layer: 'front' },
  { x: 8.0, y: .3, r: .12, cols: ['#3ad0c0', '#1f6f8b'], pattern: 'chevron', pc: ['#ffffff', '#ffc23d'], burn: 1, glow: .8, layer: 'front' },
  { x: 9.0, y: .33, r: .13, cols: ['#ffc23d', '#e5432f'], pattern: 'band', pc: ['#2b2350', '#ffffff'], burn: 1, glow: .9, people: 5, layer: 'front' },
  /* small ones by the captions */
  { x: 4.92, y: .22, r: .03, cols: ['#ff6fa8', '#ffffff'], layer: 'back' },
  { x: 6.08, y: .2, r: .03, cols: ['#5aa9e6', '#ffffff'], layer: 'back' },
  { x: 9.94, y: .5, r: .035, cols: ['#9b7be0', '#ffffff'], glow: 1, burn: .6, layer: 'back' },
];
function bigBalloon(b) {
  const u = b.x, [, , lo, hz] = skyAt(u), nk = nightK(u);
  balloon2(b.x * U, b.y * H, b.r * U * G(1, .78), { cols: b.cols, pattern: b.pattern, pc: b.pc, burn: b.burn || 0, glow: Math.max(b.glow || 0, nk * .6), people: b.people,
    light: u < 7 ? 1 : -1, sky: mix(lo, '#3a4a9a', nk), rim: mix('#ffe2b8', '#a8b4ff', nk), gores: 16, haze: b.layer === 'back' ? .25 : 0, hazeColor: hz });
}

/* ---------- building blocks ---------- */
/* a device around raw image `name`, centred on (cx, cy), screen width w, tilted rot; returns its screen rect */
function phone(name, cx, cy, w, rot = 0, o = {}) {
  const img = IMG[name], h = w * img.height / img.width;
  device(o.kind || D.kind, cx - w / 2, cy - h / 2, w, h, img, { rot, shadow: o.shadow || 'rgba(8,2,20,.6)' });
  return { x: cx - w / 2, y: cy - h / 2, w, h, k: w / img.width };
}
/* a lifted-out piece of a real screen, width w, centred on (cx, cy) */
function lift(key, cx, cy, w, o = {}) {
  const [name, src] = SRC[key], img = IMG[name];
  if (o.k) w = Math.min(src[2] * o.k, o.max || w); /* sized from the piece itself (its width follows its words) */
  const s = w / src[2];
  popout(img, src, cx - w / 2, cy - src[3] * s / 2, s, { r: o.r || 34, rot: o.rot || 0, bg: o.bg, ring: o.ring || 'rgba(255,255,255,.95)', ringW: o.ringW ?? 5 });
}
/* Big number badge: a glass card with a gold figure and a small label. align: 'l' | 'c' | 'r' at x. */
function badge(x, y, num, label, o = {}) {
  const s = o.size || G(150, 190), ls = s * .27 * TY.labelK;
  ctx.save(); ctx.font = TY.label(800, s); ctx.letterSpacing = `${-s * .01}px`;
  const nw = ctx.measureText(num).width; ctx.font = TY.label(700, ls); ctx.letterSpacing = `${ls * TY.labelTrack}px`;
  const lt = upper(label, TXT.locale), lw = ctx.measureText(lt).width;
  const pad = s * .26, w = Math.max(nw, lw) + pad * 2, h = s * 1.0 + ls * 1.5 + pad * .9;
  const x0 = o.align === 'r' ? x - w : o.align === 'c' ? x - w / 2 : x;
  if (o.rot) { ctx.translate(x0 + w / 2, y + h / 2); ctx.rotate(o.rot); ctx.translate(-(x0 + w / 2), -(y + h / 2)); }
  ctx.shadowColor = 'rgba(8,2,20,.55)'; ctx.shadowBlur = s * .5; ctx.shadowOffsetY = s * .12;
  const bg = ctx.createLinearGradient(0, y, 0, y + h); bg.addColorStop(0, 'rgba(40,26,74,.9)'); bg.addColorStop(1, 'rgba(18,10,40,.92)');
  ctx.fillStyle = bg; rrect(x0, y, w, h, s * .24); ctx.fill(); ctx.shadowColor = 'transparent';
  const rg = ctx.createLinearGradient(x0, y, x0 + w, y + h); rg.addColorStop(0, 'rgba(255,226,160,.95)'); rg.addColorStop(.5, 'rgba(255,200,110,.35)'); rg.addColorStop(1, 'rgba(255,226,160,.8)');
  ctx.strokeStyle = rg; ctx.lineWidth = Math.max(2, s * .018); rrect(x0, y, w, h, s * .24); ctx.stroke();
  ctx.textAlign = 'center'; const cx = x0 + w / 2;
  ctx.font = TY.label(800, s); ctx.letterSpacing = `${-s * .01}px`;
  const g = ctx.createLinearGradient(0, y + pad * .6, 0, y + pad * .6 + s * .8); g.addColorStop(0, '#fffaf0'); g.addColorStop(.55, '#ffe2a0'); g.addColorStop(1, '#ffb84a');
  ctx.fillStyle = g; ctx.fillText(num, cx, y + pad * .5 + s * .8);
  ctx.font = TY.label(700, ls); ctx.letterSpacing = `${ls * TY.labelTrack}px`; ctx.fillStyle = 'rgba(255,240,222,.92)';
  ctx.fillText(lt, cx + ls * .08, y + pad * .5 + s * .8 + ls * 1.45);
  ctx.restore();
  return { x: x0, y, w, h };
}
/* a small quiet pill (the ad-free note on the first screen) */
function pill(cx, y, text) {
  const s = G(34, 44) * TY.labelK;
  ctx.save(); ctx.font = TY.label(700, s); ctx.letterSpacing = `${s * TY.labelTrack * 1.1}px`;
  const t = upper(text, TXT.locale), w = ctx.measureText(t).width + s * 1.6, h = s * 1.7;
  ctx.fillStyle = 'rgba(16,8,34,.38)'; rrect(cx - w / 2, y, w, h, h / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,222,160,.75)'; ctx.lineWidth = Math.max(2, s * .06); rrect(cx - w / 2, y, w, h, h / 2); ctx.stroke();
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffe6b8'; ctx.fillText(t, cx + s * .09, y + h * .68);
  ctx.restore();
}
/* Headline (big, gold-white) and a short supporting line. Returns the bottom y. */
function caption3(cx, y, cap, o = {}) {
  const loc = TXT.locale, maxW = o.maxW || D.cap.maxW;
  ctx.save(); ctx.textAlign = 'center';
  const lines = cap.head.split('|').map(l => upper(l, loc));
  let size = (o.size || D.cap.size) * TY.headK; ctx.font = TY.head(size); ctx.letterSpacing = `${size * TY.track}px`;
  const widest = Math.max(...lines.map(l => ctx.measureText(l).width));
  if (widest > maxW) { size = Math.floor(size * maxW / widest); ctx.font = TY.head(size); ctx.letterSpacing = `${size * TY.track}px`; }
  const lh = size * TY.lh;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const gy = y + lh * lines.length * .55, gr = maxW * .6;
  const g0 = ctx.createRadialGradient(cx, gy, 0, cx, gy, gr); g0.addColorStop(0, rgba(o.glow || '#ff9a5a', .14)); g0.addColorStop(1, rgba(o.glow || '#ff9a5a', 0));
  ctx.translate(cx, gy); ctx.scale(1, .45); ctx.translate(-cx, -gy); ctx.fillStyle = g0; ctx.fillRect(cx - gr, gy - gr, gr * 2, gr * 2); ctx.restore();
  for (const line of lines) {
    y += lh;
    const g = ctx.createLinearGradient(0, y - size * TY.top, 0, y + size * (CJK ? .1 : .05));
    g.addColorStop(0, '#ffffff'); g.addColorStop(.5, '#fff3dc'); g.addColorStop(1, o.gold || '#ffc95a');
    ctx.shadowColor = 'rgba(12,2,24,.6)'; ctx.shadowBlur = size * .22; ctx.shadowOffsetY = size * .04;
    ctx.fillStyle = g; ctx.fillText(line, cx, y);
  }
  if (cap.sub) {
    const ss = (o.sub || D.cap.sub) * TY.subK; y += ss * (CJK ? 1.65 : 1.5);
    ctx.font = TY.sub(ss); ctx.letterSpacing = '0px';
    const lw = ctx.measureText(cap.sub).width; if (lw > maxW) ctx.font = TY.sub(Math.floor(ss * maxW / lw));
    ctx.fillStyle = 'rgba(255,242,228,.97)'; ctx.shadowColor = 'rgba(10,2,20,.7)'; ctx.shadowBlur = ss * .45; ctx.shadowOffsetY = 0;
    ctx.fillText(cap.sub, cx, y);
  }
  ctx.restore();
  return y;
}
/* a dark veil at the top so the words read on any picture */
function veil(h, a = .45) {
  const v = ctx.createLinearGradient(0, 0, 0, h); v.addColorStop(0, `rgba(8,4,22,${a})`); v.addColorStop(.6, `rgba(8,4,22,${a * .3})`); v.addColorStop(1, 'rgba(8,4,22,0)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, U, h);
}
/* a sunrise over fairy chimneys, drawn in the screen's own coordinates (the hero and the flight) */
function sunrise(o) {
  const sx = U * o.sun[0], sy = H * o.sun[1];
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [rr, a] of [[U * 1.5, .2], [U * .75, .26], [U * .3, .45], [U * .12, .6]]) { const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, rr); g.addColorStop(0, `rgba(255,196,120,${a})`); g.addColorStop(1, 'rgba(255,170,100,0)'); ctx.fillStyle = g; ctx.fillRect(sx - rr, sy - rr, rr * 2, rr * 2); }
  ctx.restore();
  rays(sx, sy, 26, H * .9, '#ffd29a', .09, o.seed || 4);
  const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, U * .075); sg.addColorStop(0, '#fffef6'); sg.addColorStop(.6, '#fff0c8'); sg.addColorStop(1, 'rgba(255,236,190,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, U * .075, 0, 7); ctx.fill();
  clouds(H * (o.sun[1] - .12), o.seed + 1, '#ffb08a', .3, 8);
  /* a valley full of balloons, backlit and hazy toward the sun */
  const R = mulberry32(o.seed + 2), list = [];
  for (let i = 0; i < o.swarm; i++) list.push({ x: R() * U, y: H * lerp(o.swarmY[0], o.swarmY[1], R()), d: R(), c: COLS[Math.floor(R() * COLS.length)], s: COLS[Math.floor(R() * COLS.length)], st: R() < .5 });
  list.sort((a, b) => a.d - b.d);
  for (const b of list) farBalloon(b.x, b.y, U * (.005 + .02 * Math.pow(b.d, 2.6)), b.c, .2 + (1 - b.d) * .65, '#f2a07a', { stripe: b.st ? b.s : null });
  const hz = H * o.horizon;
  ridge2(hz, H * .02, '#c87a78', o.seed + 3); ridge2(hz + H * .02, H * .025, '#a85a64', o.seed + 4);
  haze2(hz - H * .04, hz + H * .06, '#ffb488', .0, .5);
  const R2 = mulberry32(o.seed + 5);
  for (let i = 0; i < 34; i++) { const x = R2() * U * 1.1 - U * .05, hh = H * (.035 + R2() * .06); chimney(x, hz + H * .085 + R2() * H * .02, hh * .36, hh, { seed: o.seed * 50 + i, light: -1, lit: '#f6b48a', dark: '#6a3442', haze: .32, hazeColor: '#f0a080' }); }
  haze2(hz + H * .05, hz + H * .13, '#ffb488', 0, .35);
  for (let i = 0; i < 12; i++) { const x = R2() * U * 1.1 - U * .05, hh = H * (.05 + R2() * .06); chimney(x, hz + H * .17 + R2() * H * .02, hh * .35, hh, { seed: o.seed * 70 + i, light: -1, lit: '#e89a72', dark: '#4a2232', haze: .15, hazeColor: '#e08a70', windows: 2 }); }
  for (const [fx, fh] of o.front) chimney(U * fx, H * 1.02, U * fh * .34, U * fh, { seed: Math.round(fx * 100), light: -1, lit: '#c47a5c', dark: '#24101c', rim: '#ffcf8a', windows: 3 });
  const fg = ctx.createLinearGradient(0, H * .82, 0, H); fg.addColorStop(0, 'rgba(20,6,20,0)'); fg.addColorStop(1, 'rgba(20,6,20,.6)'); ctx.fillStyle = fg; ctx.fillRect(0, H * .82, U, H * .18);
}
function ridge2(base, amp, col, seed) {
  const R = mulberry32(seed), p1 = R() * 6, p2 = R() * 6;
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = -10; x <= U + 10; x += 8) ctx.lineTo(x, base - amp * (.5 + .35 * Math.sin(x / U * 7 + p1) + .15 * Math.sin(x / U * 19 + p2)));
  ctx.lineTo(U, H); ctx.closePath(); ctx.fill();
}
function haze2(y0, y1, col, a0, a1) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, rgba(col, a0)); g.addColorStop(1, rgba(col, a1)); ctx.fillStyle = g; ctx.fillRect(0, y0, U, y1 - y0); }
const lit = (cx, cy, R, cols, o = {}) => balloon2(cx, cy, R, Object.assign({ cols, gores: 16, light: -1, sky: '#ffb08a', rim: '#ffe6c0' }, o));

/* ---------- the screens ---------- */
const SCREEN = {
  /* 1: the picture everyone knows (sunrise, fairy chimneys, balloons), the real home screen in a tilted phone */
  hero() {
    sunrise({ sun: [.64, .58], horizon: .63, swarm: 110, swarmY: [.3, .6], seed: 40, front: [[.03, .42], [.17, .27], [.97, .34]] });
    lit(U * .86, H * .36, U * .085, ['#14a39a', '#f4fff8'], { pattern: 'rings', pc: ['#ffc23d', '#2b2350'], burn: .8, people: 3, haze: .15, hazeColor: '#ffb08a' });
    lit(U * .1, H * .335, U * .05, ['#9b7be0', '#ffffff'], { pattern: 'stars', pc: ['#2b2350', '#ffc23d'], burn: .6, haze: .25, hazeColor: '#ffb08a' });
    veil(H * .3, .5);
    lit(U * .3, H * .49, U * .25, ['#ff5e3a', '#ffc23d'], { pattern: 'band', pc: ['#2b2350', '#ffffff'], burn: 1, people: 5 });
    phone('home', U * G(.7, .7), H * G(.9, .87), U * G(.5, .46), G(-.07, -.06));
  },
  cities() { veil(H * .3, .2); citiesScreen(); },
  /* 3: dawn flight: a big balloon over the chimneys, the real flight screen tilted beside it */
  flight() {
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, U * 1.2, H); ctx.clip();
    sunrise({ sun: [.55, .76], horizon: .74, swarm: 60, swarmY: [.36, .72], seed: 60, front: [[.03, .36], [.95, .4]] });
    ctx.restore();
    veil(H * .3, .5);
    const r = phone('flight', U * G(.62, .6), H * G(.66, .65), U * G(.5, .46), .045);
    lit(U * G(.2, .2), H * .47, U * G(.17, .14), ['#9b7be0', '#f4eeff'], { pattern: 'stars', pc: ['#2b2350', '#ffc23d'], burn: 1, people: 4 });
    const [name, src] = SRC.lens; lens(IMG[name], src, U * G(.22, .2), H * G(.82, .8), r.k * G(1.45, 1.5));
  },
  /* 4: the company runs its days by itself: real figures from the run in big badges */
  idle() {
    veil(H * .3);
    phone(RAWS[3], U * G(.34, .36), H * G(.63, .62), U * G(.5, .46), -.05);
    const B = TXT.badges.idle;
    badge(U * .96, H * G(.45, .42), B[0][0], B[0][1], { align: 'r', rot: .02 });
    badge(U * .96, H * G(.6, .57), B[1][0], B[1][1], { align: 'r', rot: -.015 });
    lift('bar', U * .5, H * G(.9, .9), U * G(.86, .62), { k: SHOTS_APP ? G(1.25, 1.15) : 0, max: U * G(.92, .8), r: G(56, 44), bg: '#2a2550', ring: 'rgba(255,214,140,.95)', ringW: 4 });
  },
  /* 5: before and after on a diagonal: the second morning and the empire */
  holding() {
    const top = U * .8, bot = U * .3; /* the seam runs from (top, 0) to (bot, H) */
    ctx.save(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(top, 0); ctx.lineTo(bot, H); ctx.lineTo(0, H); ctx.closePath(); ctx.clip();
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1a1840'); g.addColorStop(.55, '#3e3466'); g.addColorStop(.85, '#6a5076'); g.addColorStop(1, '#7a5a76'); ctx.fillStyle = g; ctx.fillRect(0, 0, U, H);
    { const R = mulberry32(81); for (let i = 0; i < 12; i++) { const x = R() * U * .6, hh = H * (.05 + R() * .07); chimney(x, H * 1.0, hh * .35, hh, { seed: 800 + i, light: -1, lit: '#8a6a86', dark: '#2a1e3a', haze: .2, hazeColor: '#5a4a76' }); } }
    farBalloon(U * .14, H * .43, U * .02, '#ff5e3a', .3, '#5a4a76', { stripe: '#ffc23d' });
    ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.moveTo(top, 0); ctx.lineTo(U, 0); ctx.lineTo(U, H); ctx.lineTo(bot, H); ctx.closePath(); ctx.clip();
    const g2 = ctx.createLinearGradient(0, 0, 0, H); g2.addColorStop(0, '#2e1e56'); g2.addColorStop(.45, '#b2506c'); g2.addColorStop(.8, '#ff9a6a'); g2.addColorStop(1, '#ffc888'); ctx.fillStyle = g2; ctx.fillRect(0, 0, U, H);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; const sg = ctx.createRadialGradient(U * .75, H * .8, 0, U * .75, H * .8, U); sg.addColorStop(0, 'rgba(255,190,110,.45)'); sg.addColorStop(1, 'rgba(255,190,110,0)'); ctx.fillStyle = sg; ctx.fillRect(0, 0, U, H); ctx.restore();
    const R = mulberry32(90); for (let i = 0; i < 70; i++) farBalloon(U * (.3 + R() * .7), H * (.28 + R() * .62), U * (.006 + .016 * R()), COLS[i % COLS.length], .3, '#f0a080', { stripe: i % 2 ? '#ffffff' : null });
    { const R3 = mulberry32(83); for (let i = 0; i < 14; i++) { const x = U * (.3 + R3() * .75), hh = H * (.06 + R3() * .08); chimney(x, H * 1.0, hh * .35, hh, { seed: 900 + i, light: -1, lit: '#f0a882', dark: '#5a2a3a', haze: .2, hazeColor: '#ff9a70', windows: 2 }); } }
    ctx.restore();
    veil(H * .3, .4);
    /* the seam's light line starts under the words, fading in */
    const y0 = H * .24, x0 = lerp(top, bot, .24), lg = ctx.createLinearGradient(0, y0, 0, y0 + H * .08);
    lg.addColorStop(0, 'rgba(255,246,228,0)'); lg.addColorStop(1, 'rgba(255,246,228,.95)');
    ctx.save(); ctx.strokeStyle = 'rgba(255,236,200,.3)'; ctx.lineWidth = U * .016; ctx.filter = `blur(${U * .006}px)`; ctx.beginPath(); ctx.moveTo(x0, y0 + H * .04); ctx.lineTo(bot, H); ctx.stroke(); ctx.filter = 'none';
    ctx.strokeStyle = lg; ctx.lineWidth = Math.max(3, U * .0035); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(bot, H); ctx.stroke(); ctx.restore();
    const B = TXT.badges.holding;
    const r1 = phone('early', U * G(.26, .26), H * G(.53, .52), U * G(.38, .36), -.05);
    tag(U * G(.26, .26), r1.y - H * .04, B.before[0]);
    badge(U * G(.26, .26), r1.y + r1.h + H * .025, B.before[1], B.before[2], { align: 'c', size: G(100, 130), rot: -.03 });
    const r2 = phone('empire', U * G(.69, .69), H * G(.68, .67), U * G(.48, .44), .045);
    tag(U * G(.69, .69), r2.y - H * .045, B.after[0]);
    badge(U * .97, r2.y + r2.h * .32, B.after[1], B.after[2], { align: 'r', size: G(140, 170), rot: .03 });
    lift('hold', U * G(.56, .6), H * G(.935, .93), U * G(.62, SHOTS_APP ? .9 : .48), { r: 30, rot: -.02 });
  },
  /* 6: the crew, with real pilot rows held up close */
  crew() {
    veil(H * .3);
    phone('crew', U * G(.62, .6), H * G(.64, .63), U * G(.54, .5), .05);
    lift('rows', U * G(.45, .45), H * G(.66, .62), U * G(.84, .76), { r: G(30, 24), rot: -.035 });
  },
  /* 7: the studio's preview, big, with the phone below it */
  design() {
    veil(H * .3);
    phone('design', U * .52, H * G(.8, .79), U * G(.56, .5), .045);
    lift('studio', U * .5, H * G(.47, .46), U * G(.86, .66), { r: G(46, 36), rot: -.025 });
  },
  /* 8: the market: 98% of it, and a rival for sale */
  rivals() {
    veil(H * .3);
    phone('market', U * G(.37, .38), H * G(.64, .63), U * G(.52, .48), -.045);
    const B = TXT.badges.rivals;
    badge(U * .96, H * G(.44, .4), B[0], B[1], { align: 'r', rot: .025 });
    if (SRC.deal[1][2]) lift('deal', U * G(.6, .62), H * G(.8, .79), U * G(SHOTS_APP ? .64 : .7, .52), { r: 30, rot: .03 });
  },
  /* 9: full bleed: the town at night is the picture (the night caption's lines and the morning button cropped away) */
  night() {
    const img = IMG.night, sy = img.height * NIGHT_CROP[0], sh = img.height * NIGHT_CROP[1];
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, U, H); ctx.clip(); ctx.filter = 'brightness(1.18) saturate(1.12)';
    if (SHOTS_APP) {
      /* the app's night camera is closer than the prototype's: the whole width, on the bottom, the sky carried up */
      const s = U / img.width, h = sh * s, y0 = H - h;
      /* the sky above, down to the app's night sky (file pictures can't be sampled), and a few stars */
      const sk = ctx.createLinearGradient(0, 0, 0, y0 + 2); sk.addColorStop(0, '#070a20'); sk.addColorStop(1, '#16173f');
      ctx.fillStyle = sk; ctx.fillRect(0, 0, U, y0 + 2);
      const R = mulberry32(99); for (let i = 0; i < 120; i++) { const x = R() * U, y = R() * y0, a = .2 + R() * .6; ctx.fillStyle = `rgba(255,248,230,${a})`; ctx.beginPath(); ctx.arc(x, y, 1 + R() * 2.4, 0, 7); ctx.fill(); }
      ctx.drawImage(img, 0, sy, img.width, sh, 0, y0, U, h);
      const g = ctx.createLinearGradient(0, y0, 0, y0 + H * .12); g.addColorStop(0, 'rgba(22,23,63,1)'); g.addColorStop(1, 'rgba(22,23,63,0)');
      ctx.fillStyle = g; ctx.fillRect(0, y0, U, H * .12); /* the picture's top edge melts into the sky */
    } else {
      const s = H / sh, w = img.width * s;
      ctx.drawImage(img, 0, sy, img.width, sh, (U - w) / 2, 0, w, H);
    }
    ctx.restore();
    veil(H * .36, .8);
    for (const [x0, dir] of [[0, 1], [U, -1]]) { const g = ctx.createLinearGradient(x0, 0, x0 + dir * U * .12, 0); g.addColorStop(0, 'rgba(8,10,32,.9)'); g.addColorStop(1, 'rgba(8,10,32,0)'); ctx.fillStyle = g; ctx.fillRect(Math.min(x0, x0 + dir * U * .12), 0, U * .12, H); }
    const bt = ctx.createLinearGradient(0, H * .85, 0, H); bt.addColorStop(0, 'rgba(8,10,32,0)'); bt.addColorStop(1, 'rgba(8,10,32,.7)'); ctx.fillStyle = bt; ctx.fillRect(0, H * .85, U, H * .15);
  },
  /* 10: two phones from the Balloon Show */
  show() {
    veil(H * .3);
    phone('show-6', U * G(.33, .34), H * G(.61, .6), U * G(.46, .42), -.06);
    phone('show-20', U * G(.67, .66), H * G(.68, .67), U * G(.5, .46), .05);
  },
};
function tag(cx, y, text) {
  const s = G(40, 52) * TY.labelK;
  ctx.save(); ctx.font = TY.label(800, s); ctx.letterSpacing = `${s * TY.labelTrack * .9}px`; ctx.textAlign = 'center';
  const t = upper(text, TXT.locale), w = ctx.measureText(t).width + s * 1.2, h = s * 1.5;
  ctx.fillStyle = '#ffc23d'; rrect(cx - w / 2, y, w, h, h * .3); ctx.fill();
  ctx.fillStyle = '#2b2350'; ctx.fillText(t, cx + s * .07, y + h * .72); ctx.restore();
}
function captions(i) {
  const id = SCREENS[i], cap = TXT.screens[id];
  ctx.save(); ctx.translate(i * U, 0);
  const y = caption3(U / 2, H * D.cap.y, cap, { glow: i >= 8 ? '#7a6aff' : '#ff9a5a', gold: i >= 8 ? '#ffd88a' : '#ffc95a' });
  if (id === 'hero') pill(U / 2, y + G(40, 50), TXT.noAds);
  if (i === N - 1) brandMark(U / 2);
  ctx.restore();
}
/* the last screen's sign-off: the game's name at the bottom */
function brandMark(cx) {
  const s = G(46, 58) * TY.labelK, y = H - s * 1.2;
  ctx.save(); ctx.textAlign = 'center'; ctx.font = TY.label(800, s); ctx.letterSpacing = `${s * TY.labelTrack * .9}px`;
  ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 20;
  ctx.fillStyle = 'rgba(255,240,220,.95)'; ctx.fillText(upper(TXT.brand.join('  ·  '), TXT.locale), cx, y); ctx.restore();
}

function load(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('missing ' + src)); im.src = src; }); }
/* <raw>/shots.js, when the captures come from the app: SHOTS = { values: {IDLE, FLEET, DAY, SHARE},
   <device>: { pick: {logical name: file}, src: {key: rect}, night: [top, height] as fractions } } */
const shotsJs = new Promise(res => { const sc = document.createElement('script'); sc.src = `${RAW}/shots.js`; sc.onload = res; sc.onerror = res; document.head.appendChild(sc); });
shotsJs.then(() => {
  if (typeof SHOTS === 'undefined') return;
  SHOTS_APP = true;
  TXT.values = Object.assign({}, TXT.values, SHOTS.values, (SHOTS[DEV] || {}).values); /* a device's own figures win */
  (function fill(o) { for (const k in o) { if (typeof o[k] === 'string') o[k] = o[k].replace(/@([A-Z]+)/g, (m, v) => (TXT.values || {})[v] ?? m); else if (o[k] && typeof o[k] === 'object') fill(o[k]); } })(TXT);
  const d = SHOTS[DEV] || {};
  if (d.src) SRC = Object.assign({}, SRC, d.src);
  if (d.pick) { PICK = d.pick; RAWS = RAWS.map(r => r); }
  if (d.night) NIGHT_CROP = d.night;
}).then(() => Promise.all([document.fonts.load('800 100px BC'), document.fonts.load('700 40px BC'), document.fonts.load('700 40px B')]
  .concat(CJK ? [document.fonts.load(`900 100px ${CJK}`, '気球열기구'), document.fonts.load(`700 40px ${CJK}`, '気球열기구')] : []))
  .then(() => Promise.all(RAWS.map(r => load(`${RAW}/${DEV}/${PICK[r] || r}.png`).then(im => { IMG[r] = im; })))))
  .then(() => {
    drawSky(); drawStars(); drawMoon(); drawClouds(); drawFarBalloons(); drawGround();
    BIG.filter(b => b.layer === 'back').forEach(bigBalloon);
    for (let i = 0; i < N; i++) { ctx.save(); ctx.translate(i * U, 0); ctx.beginPath(); ctx.rect(-U * .5, 0, U * 2, H); SCREEN[SCREENS[i]](); ctx.restore(); }
    BIG.filter(b => b.layer === 'front').forEach(bigBalloon);
    for (let i = 0; i < N; i++) captions(i);
    document.title = 'done';
  }).catch(e => { document.title = 'error ' + e.message; console.error(e); });
</script>
