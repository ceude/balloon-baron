  for (let x = 120; x < W; x += 300) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const lg = ctx.createRadialGradient(x, H * .9 - 30, 0, x, H * .9 - 30, 90); lg.addColorStop(0, 'rgba(255,200,110,.8)'); lg.addColorStop(1, 'rgba(255,200,110,0)'); ctx.fillStyle = lg; ctx.fillRect(x - 90, H * .9 - 120, 180, 180); ctx.restore(); ctx.fillStyle = '#ffd890'; ctx.beginPath(); ctx.arc(x, H * .9 - 30, 12, 0, 7); ctx.fill(); }
  haze(H * .86, H, '#0e0610', 0, .85);
  card(90, 1060, W - 180, 270, T.c1[0], T.c1.slice(1), '#22a45d', (x, y) => { ctx.fillStyle = '#ffb3a0'; rrect(x - 50, y - 50, 100, 100, 26); ctx.fill(); ctx.fillStyle = '#2b2350'; ctx.font = '800 64px BC'; ctx.textAlign = 'center'; ctx.fillText('H', x, y + 22); ctx.textAlign = 'left'; });

/* A wooden signpost with the place's name. */
function signpost(x, y, name, land, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#3a2416'; ctx.fillRect(-10, -20, 20, 200);
  ctx.font = '800 64px BC'; const w = Math.max(ctx.measureText(name).width, 260) + 80;
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  const g = ctx.createLinearGradient(0, -170, 0, -20); g.addColorStop(0, '#8a5a32'); g.addColorStop(1, '#5a3418');
  ctx.fillStyle = g; rrect(-w / 2, -175, w, 150, 18); ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#ffc23d'; ctx.lineWidth = 5; rrect(-w / 2 + 10, -165, w - 20, 130, 12); ctx.stroke();
  ctx.fillStyle = '#2a1608'; for (const nx of [-w / 2 + 26, w / 2 - 26]) { ctx.beginPath(); ctx.arc(nx, -100, 7, 0, 7); ctx.fill(); }
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff3d6'; ctx.fillText(name, 0, -92);
  ctx.font = '700 34px BC'; ctx.letterSpacing = '8px'; ctx.fillStyle = '#ffc23d'; ctx.fillText(land, 0, -46);
  ctx.restore();
}

/* ---------- skyline pieces ---------- */
function tower(x, base, w, h, body, lit, seed) {
  const R = mulberry32(seed);
  const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, mix(body, '#000000', .35)); g.addColorStop(.5, body); g.addColorStop(1, mix(body, '#000000', .55));
  ctx.fillStyle = g; ctx.fillRect(x, base - h, w, h);
  for (let yy = base - h + 18; yy < base - 12; yy += 26) for (let xx = x + 10; xx < x + w - 10; xx += 22) if (R() < lit) { ctx.fillStyle = R() < .5 ? 'rgba(255,214,140,.85)' : 'rgba(255,180,100,.65)'; ctx.fillRect(xx, yy, 10, 12); }
}
function empireState(x, base, s, c) {
  ctx.fillStyle = c;
  for (const [w, h] of [[220, 520], [170, 680], [120, 820], [80, 900], [40, 960]]) ctx.fillRect(x - w * s / 2, base - h * s, w * s, h * s);
  ctx.fillRect(x - 6 * s, base - 1080 * s, 12 * s, 130 * s);
}
function lotteTower(x, base, s, c) {
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x - 110 * s, base); ctx.quadraticCurveTo(x - 90 * s, base - 700 * s, x - 14 * s, base - 1180 * s); ctx.lineTo(x + 14 * s, base - 1180 * s); ctx.quadraticCurveTo(x + 90 * s, base - 700 * s, x + 110 * s, base); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,160,.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x, base - 1170 * s); ctx.stroke();
}
function tokyoTower(x, base, s) {
  ctx.strokeStyle = '#e8402c'; ctx.lineWidth = 10 * s; ctx.lineJoin = 'round';
  const H0 = 900 * s, legs = [[-150, 0], [150, 0]];
  ctx.beginPath(); ctx.moveTo(x - 150 * s, base); ctx.quadraticCurveTo(x - 40 * s, base - H0 * .5, x - 8 * s, base - H0); ctx.moveTo(x + 150 * s, base); ctx.quadraticCurveTo(x + 40 * s, base - H0 * .5, x + 8 * s, base - H0); ctx.stroke();
  ctx.lineWidth = 4 * s;

function slide8() {
