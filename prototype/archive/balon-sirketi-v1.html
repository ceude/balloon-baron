<title>Şafak Balon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed dawn canvas (sky, chimneys, balloons) always behind; header strip on top; office sheet slides over the lower part */
:root{
  --dusk:#1c1428;
  --panel:rgba(28,20,40,.94);
  --apricot:#ff9f5f;
  --gold:#ffd27a;
  --mist:#efe3d6;
  --muted:#b6a5b4;
  --line:rgba(255,159,95,.24);
  --ok:#74c98a;
  --warn:#f2c94c;
  --bad:#ef6a50;
  --display:"Young Serif", Georgia, serif;
  --ui:"Figtree", "Segoe UI", system-ui, sans-serif;
  --num:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--dusk);color:var(--mist);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

#top{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
  background:linear-gradient(rgba(20,14,30,.85),rgba(20,14,30,.4));}
#top .co{font-family:var(--display);font-size:17px;color:var(--gold);margin-right:auto}
#top .kv{display:flex;flex-direction:column;line-height:1.1}
#top .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#top .v{font-size:14px;font-weight:600}
#top .v.neg{color:var(--bad)}
#bSave,#bNew{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--muted)}

/* office sheet */
#sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;z-index:5;width:min(600px,100%);max-height:66%;
  display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.5)}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:8px 11px 9px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--apricot)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-left:5px;vertical-align:middle}
#tabBody{overflow-y:auto;padding:12px max(14px, env(safe-area-inset-right, 0px)) 12px max(14px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:12px}
.foot{padding:10px 14px max(12px, env(safe-area-inset-bottom, 0px));border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.foot .sum{flex:1;font-size:12.5px;color:var(--muted);line-height:1.35;min-width:0}
.foot .sum b{color:var(--mist)}
.cta{background:var(--apricot);color:#22140c;border:0;border-radius:999px;padding:11px 20px;font-weight:700;font-size:14px;white-space:nowrap}
.cta:disabled{opacity:.45;cursor:not-allowed}

h3{margin:0;font-family:var(--display);font-weight:400;font-size:16px;color:var(--gold)}
.sec{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.45;margin:0}
.wx{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04)}
.flag{width:14px;height:26px;border-radius:2px;flex:none;position:relative}
.flag::before{content:"";position:absolute;left:-3px;top:-2px;width:2px;height:34px;background:var(--muted)}
.wx .t{font-weight:700}
.layers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.layer{text-align:center;font-size:11px;color:var(--muted);padding:6px 2px;border-radius:8px;background:rgba(255,255,255,.04)}
.layer b{display:block;font-size:13px;color:var(--mist)}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;font-size:14px}
.row .sub{font-size:12px;color:var(--muted)}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;white-space:nowrap}
.pill.ok{background:rgba(116,201,138,.16);color:var(--ok)}
.pill.warn{background:rgba(242,201,76,.16);color:var(--warn)}
.pill.bad{background:rgba(239,106,80,.18);color:var(--bad)}
.sbtn{background:rgba(255,159,95,.12);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.sbtn:disabled{opacity:.4;cursor:not-allowed}
.sbtn.on{background:var(--apricot);color:#22140c;border-color:var(--apricot)}
.price{display:flex;align-items:center;gap:12px}
.price input{flex:1;accent-color:var(--apricot)}
.price .pv{font-size:20px;min-width:66px;text-align:right;color:var(--gold)}
.ticks{position:relative;height:16px;margin:-4px 78px 0 0}
.tick{position:absolute;top:0;transform:translateX(-50%);font-size:9.5px;color:var(--muted);white-space:nowrap}
.tick i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}
.alert{padding:9px 11px;border-radius:10px;font-size:13px;line-height:1.4;border:1px solid}
.alert.bad{border-color:rgba(239,106,80,.5);background:rgba(239,106,80,.1)}
.alert.warn{border-color:rgba(242,201,76,.45);background:rgba(242,201,76,.08)}
.alert.ok{border-color:rgba(116,201,138,.45);background:rgba(116,201,138,.08)}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.06)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:6px 4px;text-align:right;border-bottom:1px solid rgba(255,255,255,.06)}
td:first-child,th:first-child{text-align:left}
th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tw{overflow-x:auto}

/* report & end */
.modal{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:rgba(12,8,18,.6);
  padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px))}
.card{width:min(460px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;color:var(--gold);text-wrap:balance}
.ledger{display:flex;flex-direction:column;gap:3px;font-size:13px}
.ledger div{display:flex;justify-content:space-between;gap:10px}
.ledger .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:4px;font-weight:700}
.pos{color:var(--ok)} .negc{color:var(--bad)}
.events{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-size:13px;line-height:1.4}
.events li{padding-left:12px;position:relative}
.events li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--apricot)}
.events li.r::before{background:var(--muted)}

#tip{position:absolute;left:50%;transform:translateX(-50%);bottom:max(18px, env(safe-area-inset-bottom, 0px));z-index:4;
  width:min(440px,calc(100% - 32px));text-align:center;font-size:14px;line-height:1.45;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
#burn{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:max(22px, env(safe-area-inset-bottom, 0px));z-index:4;
  width:84px;height:84px;border-radius:50%;border:2px solid var(--apricot);background:rgba(255,159,95,.18);font-weight:700;font-size:13px;color:var(--gold);touch-action:none;-webkit-user-select:none;user-select:none}
#burn.on{background:var(--apricot);color:#22140c}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="top">
    <div class="co">Şafak Balon</div>
    <div class="kv"><span class="k">Gün</span><span class="v num" id="hDay"></span></div>
    <div class="kv"><span class="k">Kasa</span><span class="v num" id="hCash"></span></div>
    <div class="kv"><span class="k">İtibar</span><span class="v num" id="hRep"></span></div>
    <button id="bSave">Kayıt</button>
    <button id="bNew">Yeni oyun</button>
  </div>

  <div id="sheet">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="tabBody"></div>
    <div class="foot"><div class="sum" id="footSum"></div><button class="cta" id="go"></button></div>
  </div>

  <div id="tip" hidden></div>
  <button id="burn" hidden>BRÜLÖR</button>

  <div class="modal" id="report" hidden><div class="card" id="reportCard"></div></div>
  <div class="modal" id="saveBox" hidden><div class="card">
    <h2>Kayıt</h2>
    <p class="muted" id="saveStatus"></p>
    <p class="muted">Başka bir cihazda devam etmek ya da yedek almak için bu kodu kopyala. Orada aynı kutuya yapıştırıp Yükle'ye bas.</p>
    <textarea id="saveCode" rows="4" style="width:100%;font:12px var(--num);background:rgba(255,255,255,.05);color:var(--mist);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical"></textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="sbtn" id="saveCopy">Kodu kopyala</button><button class="sbtn" id="saveLoad">Yapıştırılan kodu yükle</button><button class="cta" id="saveClose" style="margin-left:auto">Kapat</button></div>
    <p class="muted" id="saveMsg"></p>
  </div></div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1, T = 0;

/* ---------- constants ---------- */
const SIZES = {
  S: { cap: 8,  cost: 7000,  fuel: 60,  up: 40, risk: .8,  label: 'Küçük sepet' },
  M: { cap: 16, cost: 15000, fuel: 90,  up: 60, risk: 1,   label: 'Orta sepet' },
  L: { cap: 24, cost: 26000, fuel: 120, up: 80, risk: 1.3, label: 'Büyük sepet' }
};
const LEVELS = [null, { name: 'Çaylak', wage: 90, risk: 1.6 }, { name: 'Deneyimli', wage: 150, risk: 1 }, { name: 'Kıdemli', wage: 240, risk: .6 }];
const FLAGS = {
  green:  { name: 'Yeşil bayrak',   acc: .006, ins: 1, dem: 1,  wind: 1,    gust: .25, col: '#74c98a', note: 'Uçuşa uygun. Rüzgâr hafif.' },
  yellow: { name: 'Sarı bayrak',    acc: .05,  ins: 2, dem: .9, wind: 1.45, gust: .9,  col: '#f2c94c', note: 'Riskli. Sigorta primleri iki katı, kaza ihtimali yüksek.' },
  red:    { name: 'Kırmızı bayrak', acc: .14,  ins: 0, dem: 1,  wind: 2,    gust: 1.7, col: '#ef6a50', note: 'Uçuş yasak. Uçarsan %35 yakalanma ihtimali, €5.000 ceza ve sigorta geçersiz.' }
};
const BANDS = [[0, 60], [60, 180], [180, 350], [350, 650]], CENTERS = [30, 120, 265, 500];
const B_NAMES = ['Şafak', 'Güvercin', 'Zelve', 'Uçhisar', 'Avanos', 'Ihlara', 'Ortahisar', 'Kızılçukur', 'Paşabağ', 'Erciyes', 'Soğanlı', 'Mustafapaşa'];
const P_NAMES = ['Mert', 'Elif', 'Kerem', 'Zeynep', 'Hakan', 'Selin', 'Burak', 'Derya', 'Emre', 'Aslı', 'Onur', 'Ceren', 'Tolga', 'Melis', 'Cem', 'İpek'];
const LOANS = [
  { amt: 10000, days: 40, inst: 300, need: 0 },
  { amt: 25000, days: 45, inst: 650, need: 2 },
  { amt: 50000, days: 50, inst: 1250, need: 3 }
];
const SIM = 6;
const ME_COL = ['#ff9f5f', '#ffd27a'];

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const eur = n => (n < 0 ? '−€' : '€') + Math.abs(Math.round(n)).toLocaleString('tr-TR');
const pct = n => '%' + (n * 100).toLocaleString('tr-TR', { maximumFractionDigits: 1 });
const stars = r => clamp(3 + (r - .75) * 4, 1, 5).toLocaleString('tr-TR', { maximumFractionDigits: 1 }) + '★';
function hex(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(a, b, k) { const A = hex(a), B = hex(b); k = clamp(k, 0, 1); return '#' + A.map((x, i) => Math.round(lerp(x, B[i], k)).toString(16).padStart(2, '0')).join(''); }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }

/* ---------- state ---------- */
let S = null;
function newState() {
  const s = {
    day: 1, cash: 3000, rep: 1, price: 170, strikes: 0, banUntil: 0, selfFly: true, nextId: 1,
    ins: { hull: true, pax: true }, balloons: [], pilots: [], candidates: [], loans: [], demandBase: 165,
    rivals: [
      { name: 'Göreme Sky',        col: '#7fb7e6', col2: '#e8f1fa', style: 'safe',  balloons: ['L', 'L', 'M', 'M', 'M'], price: 195, rep: 1.15, cash: 40000 },
      { name: 'Peribaca Balloons', col: '#b48ce0', col2: '#f2e6ff', style: 'mid',   balloons: ['M', 'M', 'S'],           price: 165, rep: 1,    cash: 12000 },
      { name: 'Kızıl Vadi Air',    col: '#e0604a', col2: '#ffe0b0', style: 'risky', balloons: ['S', 'S'],                price: 135, rep: .85,  cash: 5000 }
    ],
    lastShare: null, monopolyShown: false, over: false, tutorialDone: false
  };
  s.rivals.forEach(r => { r.alive = true; r.dmg = r.balloons.map(() => 0); r.lastPax = 0; r.lastCap = 0; r.forSale = null; r.strikes = 0; });
  s.balloons.push({ id: s.nextId++, size: 'S', name: 'Şafak', fly: true, dmgUntil: 0, pilot: null });
  s.flag = s.balloons[0].id;
  return s;
}
let savedOk = false;
function save() { try { localStorage.setItem('safak-balon-v1', JSON.stringify(S)); savedOk = true; } catch (e) { savedOk = false; } }
function load() { try { const j = localStorage.getItem('safak-balon-v1'); return j ? JSON.parse(j) : null; } catch (e) { return null; } }

/* ---------- weather & world ---------- */
function newWeather() {
  const r = Math.random(), flag = S.day === 1 ? 'green' : r < .55 ? 'green' : r < .85 ? 'yellow' : 'red', F = FLAGS[flag];
  const surf = flag === 'green' ? rnd(3, 10) : flag === 'yellow' ? rnd(11, 18) : rnd(19, 30);
  const L = [(Math.random() < .5 ? -1 : 1) * surf / 3.6 * .45, rnd(-4, 4) * F.wind, rnd(-6, 6) * F.wind, rnd(-8, 8) * F.wind];
  if (!L.some(v => v > 3)) { const i = 1 + Math.floor(Math.random() * 3); L[i] = rnd(3.5, 6) * F.wind; }
  if (!L.some(v => v < -.5)) { let m = 0; L.forEach((v, i) => { if (v < 3 && (L[m] >= 3 || v < L[m])) m = i; }); L[m] = -rnd(1, 4) * F.wind; }
  return { flag, surf: Math.round(surf), layers: L, target: 220 + rnd(1300, 2100), seed: Math.floor(Math.random() * 1e9) };
}
function windAt(alt, t) {
  const Wx = S.weather, Ls = Wx.layers, g = FLAGS[Wx.flag].gust;
  let v;
  if (alt <= CENTERS[0]) v = Ls[0];
  else if (alt >= CENTERS[3]) v = Ls[3];
  else {
    let i = 0; while (alt > CENTERS[i + 1]) i++;
    const k = (alt - CENTERS[i]) / (CENTERS[i + 1] - CENTERS[i]);
    const s = clamp((k - .5) / .35 + .5, 0, 1), sm = s * s * (3 - 2 * s);
    v = lerp(Ls[i], Ls[i + 1], sm);
  }
  return v + g * .6 * (Math.sin(t * .11 + alt * .013) + .6 * Math.sin(t * .37 + alt * .031));
}
let terrain = [], bgBalloons = [];
function buildWorld() {
  const R = mulberry32(S.weather.seed), tx = S.weather.target;
  terrain = [];
  for (let x = -600; x < 4200; x += rnd(90, 190)) {
    if (Math.abs(x - 220) < 160 || Math.abs(x - tx) < 140) continue;
    terrain.push({ x, h: 30 + R() * 65, w: 26 + R() * 22, tone: R() });
  }
  bgBalloons = [];
  const owners = [];
  S.rivals.forEach(r => { if (r.alive) for (let i = 0; i < r.balloons.length; i++) owners.push([r.col, r.col2]); });
  for (let i = 0; i < S.balloons.length - 1; i++) owners.push(ME_COL);
  const n = Math.min(18, owners.length);
  for (let i = 0; i < n; i++) bgBalloons.push({ x: rnd(-400, 3400), alt: rnd(60, 560), c: owners[i % owners.length], ph: Math.random() * 6, s: rnd(.55, .85) });
}
function terrainH(x) {
  let h = 0;
  for (const c of terrain) { const d = Math.abs(x - c.x); if (d < c.w / 2) h = Math.max(h, c.h * Math.pow(1 - d / (c.w / 2), .6)); }
  return h;
}

/* ---------- fleet helpers ---------- */
function bal(id) { return S.balloons.find(b => b.id === id); }
function assignPilots() {
  S.balloons.forEach(b => b.pilot = null);
  const need = S.balloons.filter(b => !(b.id === S.flag && S.selfFly)).sort((a, b) => SIZES[b.size].cap - SIZES[a.size].cap);
  const ps = S.pilots.slice().sort((a, b) => b.lvl - a.lvl);
  need.forEach((b, i) => { if (ps[i]) b.pilot = ps[i].id; });
}
function canFly(b) {
  if (S.banUntil >= S.day) return 'ban';
  if (b.dmgUntil > S.day) return 'dmg';
  if (!(b.id === S.flag && S.selfFly) && !b.pilot) return 'nopilot';
  return 'ok';
}
function flying() { return S.balloons.filter(b => b.fly && canFly(b) === 'ok'); }
function pilotOf(b) { return S.pilots.find(p => p.id === b.pilot); }
function riskOf(b) {
  const F = FLAGS[S.weather.flag];
  if (b.id === S.flag && S.selfFly) return null;
  const p = pilotOf(b); return F.acc * (p ? LEVELS[p.lvl].risk : 1) * SIZES[b.size].risk;
}
function newCandidates() {
  S.candidates = [];
  for (let i = 0; i < 3; i++) {
    const r = Math.random(), lvl = r < .5 ? 1 : r < .85 ? 2 : 3;
    S.candidates.push({ id: S.nextId++, name: pick(P_NAMES) + ' ' + String.fromCharCode(65 + Math.floor(Math.random() * 26)) + '.', lvl });
  }
}

/* ---------- market ---------- */
function allocate(comps, T) {
  const att = comps.map(c => c.cap > 0 ? c.rep * Math.pow(190 / c.price, 2.4) : 0);
  const sum = att.reduce((a, b) => a + b, 0);
  const capSum = comps.reduce((a, c) => a + c.cap, 0);
  const avgP = capSum ? comps.reduce((a, c) => a + c.price * c.cap, 0) / capSum : 180;
  const Te = T * clamp(Math.pow(185 / avgP, 1.1), .5, 1.4);
  const pax = comps.map((c, i) => sum ? Math.min(c.cap, Math.floor(Te * att[i] / sum)) : 0);
  let left = (Te - pax.reduce((a, b) => a + b, 0)) * .7;
  for (let pass = 0; pass < 3 && left >= 1; pass++) {
    const sp = comps.map((c, i) => c.cap - pax[i] > 0 ? att[i] : 0), s2 = sp.reduce((a, b) => a + b, 0);
    if (!s2) break; let used = 0;
    comps.forEach((c, i) => { if (!sp[i]) return; const add = Math.min(c.cap - pax[i], Math.max(1, Math.floor(left * sp[i] / s2))); pax[i] += add; used += add; });
    left -= used; if (!used) break;
  }
  return pax;
}
function rivalFlyPlan() {
  const flag = S.weather.flag;
  S.rivals.forEach(r => {
    r.fly = [];
    if (!r.alive) return;
    const go = flag === 'green' ? 1 : flag === 'yellow' ? (r.style === 'safe' ? .5 : 1) : (r.style === 'risky' && Math.random() < .5 ? 1 : 0);
    const avail = []; r.balloons.forEach((s, i) => { if (r.dmg[i] <= S.day) avail.push(i); });
    r.fly = go === 1 ? avail : go === .5 ? avail.filter((_, k) => k % 2 === 0) : [];
  });
}
function market(myPrice, myCap) {

  return { pax: allocate(comps, S.demand), caps: comps.map(c => c.cap) };
}

/* ---------- day flow ---------- */
let mode = 'office', tab = 'plan', FL = null, lastReport = null;
function startDay() {
  if (!S.weather) S.weather = newWeather();
  if (!S.demand) S.demand = Math.round(S.demandBase * (1 + .015 * (S.day - 1)) * rnd(.85, 1.15) * FLAGS[S.weather.flag].dem);
  if (!S.candidates.length) newCandidates();
  if (!S.rivals[0].fly) rivalFlyPlan();
  assignPilots(); buildWorld(); save();
  mode = 'office'; $('sheet').hidden = false; $('tip').hidden = true; $('burn').hidden = true; $('report').hidden = true;
  renderTop(); renderTabs(); renderTab(); renderFoot();
}
function launch() {
  const fl = flying(), cap = fl.reduce((a, b) => a + SIZES[b.size].cap, 0);
  const m = market(S.price, cap);
  const plan = { pax: {}, rpax: m.pax.slice(1), rcap: m.caps.slice(1) };
  let left = m.pax[0];
  const order = fl.slice().sort((a, b) => (b.id === S.flag) - (a.id === S.flag));
  for (const b of order) { const n = Math.min(left, SIZES[b.size].cap); plan.pax[b.id] = n; left -= n; }
  S.plan = plan;
  const fb = bal(S.flag);
  if (S.selfFly && fl.includes(fb)) startFlight(plan.pax[fb.id] || 0);
  else finishDay(null);
}
function finishDay(flight) {
  const F = FLAGS[S.weather.flag], red = S.weather.flag === 'red', ev = [], rev = [];
  const Lg = { rev: 0, tips: 0, fuel: 0, wage: 0, up: 0, ins: 0, loan: 0, repair: 0, comp: 0, fine: 0 };
  const fl = flying(); let paxTotal = 0, flewAny = fl.length > 0;
  for (const b of fl) {
    const z = SIZES[b.size], pax = S.plan.pax[b.id] || 0; paxTotal += pax;
    Lg.rev += pax * S.price; Lg.fuel += z.fuel;
    if (!red) { if (S.ins.hull) Lg.ins += z.cost * .004 * F.ins; if (S.ins.pax) Lg.ins += z.cap * 5 * F.ins; }
    let sev = 0;
    if (b.id === S.flag && S.selfFly && flight) {
      const q = flight.q;
      if (q === 'perfect') { Lg.tips += pax * 15; S.rep += .03; ev.push(`${b.name}: kusursuz iniş. Yolcular ${eur(pax * 15)} bahşiş bıraktı.`); }
      else if (q === 'good') { Lg.tips += pax * 6; S.rep += .01; ev.push(`${b.name}: düzgün iniş, yolcular memnun.`); }
      else if (q === 'far') { S.rep -= .02; ev.push(`${b.name}: hedeften ${Math.round(flight.dist)} m uzağa indin. Yer ekibi seni geç buldu.`); }
      else if (q === 'hard') sev = .3;
      else if (q === 'crash') sev = .8;
    } else if (Math.random() < riskOf(b)) sev = rnd(.2, 1);
    else S.rep += .004;
    if (sev) {
      const repair = z.cost * .35 * sev, comp = pax * 2500 * sev, days = 1 + Math.ceil(4 * sev);
      const hullPaid = S.ins.hull && !red, paxPaid = S.ins.pax && !red;
      if (!hullPaid) Lg.repair += repair;
      if (!paxPaid) Lg.comp += comp;
      b.dmgUntil = S.day + days; S.rep -= .08 + .15 * sev;
      const who = b.id === S.flag && S.selfFly ? 'Sen' : (pilotOf(b) ? pilotOf(b).name : 'Pilot');
      ev.push(`${b.name} (${who}) ${sev > .6 ? 'ağır kaza yaptı' : 'sert iniş yaptı'}. ${days} gün yerde kalacak. Onarım ${eur(repair)}${hullPaid ? ' sigortadan' : ' kasadan'}, tazminat ${eur(comp)}${paxPaid ? ' sigortadan' : ' kasadan'}.`);
    }
  }
  if (red && flewAny) {
    if (Math.random() < .35) {
      Lg.fine += 5000; S.strikes++;
      ev.push(`Kırmızı bayrakta uçarken yakalandın: €5.000 ceza. Uyarı ${S.strikes}/3.`);
      if (S.strikes >= 3) { S.banUntil = S.day + 3; S.strikes = 0; ev.push('Üçüncü uyarı: şirketine 3 gün uçuş yasağı geldi.'); }
    } else ev.push('Kırmızı bayrakta uçtun ve kimse fark etmedi. Bu sefer.');
  }
  Lg.wage = S.pilots.reduce((a, p) => a + LEVELS[p.lvl].wage, 0);
  Lg.up = S.balloons.reduce((a, b) => a + SIZES[b.size].up, 0);
  S.loans.forEach(l => { Lg.loan += l.inst; l.left--; });
  S.loans = S.loans.filter(l => l.left > 0);
  const net = Lg.rev + Lg.tips - Lg.fuel - Lg.wage - Lg.up - Lg.ins - Lg.loan - Lg.repair - Lg.comp - Lg.fine;
  S.cash += net;
  S.rep = clamp(lerp(S.rep, 1, .01), .4, 1.4);

  simRivals(rev);

  if (S.cash < -5000) {
    const sellable = S.balloons.filter(b => b.id !== S.flag).sort((a, b) => SIZES[b.size].cost - SIZES[a.size].cost);
    const take = sellable[0] || (S.balloons.length ? S.balloons[0] : null);
    if (take && (sellable.length || S.cash < -5000)) {
      const v = SIZES[take.size].cost * .5; S.cash += v;
      S.balloons = S.balloons.filter(b => b !== take);
      ev.push(`Banka borcun için ${take.name} balonuna el koydu ve ${eur(v)}'ya sattı.`);
      if (take.id === S.flag && S.balloons.length) S.flag = S.balloons[0].id;
    }
    if (!S.balloons.length) S.over = true;
  }

  const capToday = S.plan ? fl.reduce((a, b) => a + SIZES[b.size].cap, 0) : 0;
  S.lastShare = { me: paxTotal, rivals: S.plan.rpax.slice(), demand: S.demand };
  lastReport = { day: S.day, flag: S.weather.flag, Lg, net, ev, rev, paxTotal, capToday, flight };
  S.day++; S.weather = null; S.demand = 0; S.plan = null; S.rivals.forEach(r => r.fly = null);
  newCandidates();
  S.weather = newWeather();
  S.demand = Math.round(S.demandBase * (1 + .015 * (S.day - 1)) * rnd(.85, 1.15) * FLAGS[S.weather.flag].dem);
  rivalFlyPlan(); assignPilots(); buildWorld(); save();
  showReport();
}
function simRivals(rev) {
  const F = FLAGS[S.weather.flag], red = S.weather.flag === 'red';
  S.rivals.forEach((r, ri) => {
    if (!r.alive) return;
    const pax = S.plan.rpax[ri] || 0, cap = S.plan.rcap[ri] || 0;
    const insured = r.style !== 'risky';
    let cost = r.balloons.reduce((a, s) => a + SIZES[s].up + 150, 0), income = pax * r.price, hit = 0;
    r.fly.forEach(i => {
      const z = SIZES[r.balloons[i]]; cost += z.fuel;
      if (insured && !red) cost += z.cost * .004 * F.ins + z.cap * 5 * F.ins;
      const p = F.acc * (r.style === 'safe' ? .8 : r.style === 'risky' ? 1.3 : 1) * z.risk;
      if (Math.random() < p) {
        const sev = rnd(.2, 1), share = cap ? pax * z.cap / cap : 0;
        if (!(insured && !red)) cost += z.cost * .35 * sev + share * 2500 * sev;
        r.dmg[i] = S.day + 1 + Math.ceil(4 * sev); r.rep -= .1 + .12 * sev; hit++;
      }
    });
    if (hit) rev.push(`${r.name}: ${hit} balonu kaza yaptı.`);
    if (red && r.fly.length) { if (Math.random() < .35) { cost += 5000; rev.push(`${r.name} kırmızı bayrakta uçtu ve €5.000 ceza yedi.`); } else rev.push(`${r.name} kırmızı bayrakta gizlice uçtu.`); }
    r.cash += income - cost;
    r.rep = clamp(lerp(r.rep, r.style === 'safe' ? 1.1 : r.style === 'risky' ? .9 : 1, .04), .4, 1.4);
    r.lastPax = pax; r.lastCap = cap;
    if (cap) {
      const load = pax / cap, perSeat = (cost / Math.max(1, cap)), floor = perSeat / .75 * (r.style === 'safe' ? 1 : r.style === 'mid' ? .9 : .75);
      const old = r.price;
      if (load < .6) r.price *= .95; else if (load > .95) r.price *= 1.04;
      if (S.price < r.price * .9 && load < .7) r.price *= .94;
      r.price = clamp(Math.round(r.price), Math.round(Math.max(70, floor)), 320);
      if (Math.abs(r.price - old) >= 8) rev.push(`${r.name} fiyatını ${eur(old)} → ${eur(r.price)} yaptı.`);
      const next = r.style === 'safe' ? 'L' : 'M';
      const maxB = r.style === 'safe' ? 10 : r.style === 'mid' ? 7 : 5;
      if (r.cash > SIZES[next].cost * 2 && load > .9 && r.balloons.length < maxB && S.day - (r.lastBuy || 0) >= 4) { r.lastBuy = S.day; r.cash -= SIZES[next].cost; r.balloons.push(next); r.dmg.push(0); rev.push(`${r.name} filosuna yeni bir balon ekledi.`); }
    }
    if (r.cash < -10000) {
      r.alive = false;
      const v = r.balloons.reduce((a, s) => a + SIZES[s].cost, 0) * .45;
      r.forSale = { sizes: r.balloons.slice(), price: Math.round(v / 100) * 100 };
      rev.push(`${r.name} iflas etti! Filosu satışta: ${r.balloons.length} balon, ${eur(r.forSale.price)}.`);
    }
  });
}

  mode = 'flight'; $('sheet').hidden = true; $('burn').hidden = false;
  $('tip').hidden = false;
  $('tip').innerHTML = S.tutorialDone ? `${pax} yolcu sepette. Hedef: doğudaki iniş alanı.` : '<b>Basılı tut:</b> brülör yanar, balon ısınıp yükselir. <b>Bırak:</b> soğur ve alçalır. Rüzgâr yüksekliğe göre değişir. Doğru katmanı yakala, hedef alana yavaşça in.';
}

  const w = windAt(f.alt, f.t);

  f.t += s;
  if (f.alt > 15) { if (!f.air) { f.air = true; if (!S.tutorialDone) $('tip').hidden = true; } }
  if (f.air) {
    const th = terrainH(f.x);
    if (th > 4 && f.alt < th) return land('crash');
    if (f.alt <= 0) { f.alt = 0; return land(-f.vy > 2.6 ? 'hard' : null); }
  }
  if (f.air && f.alt > 0 && f.fuel <= 0 && !f.msg) { f.msg = 1; $('tip').hidden = false; $('tip').textContent = 'Yakıt bitti! Balon soğuyarak iniyor.'; }
}
function land(q) {

  f.dist = Math.abs(f.x - S.weather.target);

  f.q = q; S.tutorialDone = true;
  const msg = {
    perfect: 'Kusursuz iniş! Hedef alanın tam ortası.',
    good: 'İyi iniş. Yer ekibi seni hemen buldu.',
    far: `Hedeften ${Math.round(f.dist)} m uzağa indin. Yolcular bir saat beklemek zorunda kaldı.`,
    hard: 'Sert iniş! Sepet devrildi, yolcularda hafif yaralanmalar var.',
    crash: 'Peribacasına çarptın! Balon ağır hasarlı, yolcular yaralı.'
  }[q];
  const tip = $('tip'); tip.hidden = false; tip.replaceChildren(h('div', null, msg));
  const b = btn('Gün sonu raporu', () => finishDay({ q, dist: f.dist }), 'cta'); b.style.marginTop = '10px'; tip.appendChild(b);
}
['pointerdown'].forEach(e => $('burn').addEventListener(e, ev => { ev.preventDefault(); setBurn(true); }));
['pointerup', 'pointercancel', 'pointerleave'].forEach(e => $('burn').addEventListener(e, () => setBurn(false)));
cv.addEventListener('pointerdown', () => setBurn(true));
['pointerup', 'pointercancel', 'pointerleave'].forEach(e => cv.addEventListener(e, () => setBurn(false)));

  ctx.quadraticCurveTo(x + R * .75, cy + R * 1.15, x + R * .22, cy + R * 1.55); ctx.lineTo(x - R * .22, cy + R * 1.55);

}
function draw(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const p = f ? clamp(f.t / 420, 0, 1) * .85 + .1 : .12 + Math.sin(T * .05) * .02;
  const top = $('top').offsetHeight;
  const groundY = H * .86, topY = top + 34, ky = (groundY - topY) / 650, kx = clamp(W / 900, .4, 1.4);
  const focusX = f ? f.x : 220 + Math.sin(T * .03) * 40;

  const R = mulberry32(5);
  for (let i = 0; i < 40; i++) {
    const wx = i * 130 + R() * 60 - 600, x = (wx - camX * .45) * kx, hh = H * (.06 + R() * .08), ww = hh * (.4 + R() * .2);
    if (x < -60 || x > W + 60) continue;
    chimney(x, groundY + 2, ww, hh, mix('#5c3a4a', '#d9a07a', p), null, mix('#3e2836', '#9a6448', p));
  }
  // background balloons
  for (const b of bgBalloons) {
    b.x += windAt(b.alt, T * 6) * dt * (f ? SIM : 2);
    if (b.x > camX + W / kx + 900) b.x = camX - 600; if (b.x < camX - 900) b.x = camX + W / kx + 500;
    const yy = sy(b.alt + Math.sin(T * .4 + b.ph) * 6), xx = sx(b.x);

  const trx = sx(tx + 35); ctx.fillStyle = '#e8e2d6'; ctx.fillRect(trx, groundY - 13, 22, 9); ctx.fillRect(trx + 14, groundY - 18, 9, 6); ctx.fillStyle = '#7b5a3c'; ctx.fillRect(trx - 18, groundY - 10, 16, 6);
  ell(trx + 4, groundY - 3, 3, 3, '#1d1418'); ell(trx + 18, groundY - 3, 3, 3, '#1d1418'); ell(trx - 10, groundY - 3, 3, 3, '#1d1418');

  }
  // band lines & wind arrows

  ctx.font = `600 ${fs}px Figtree, system-ui, sans-serif`;
  const curAlt = f ? f.alt : -1;
  for (let i = 0; i < 4; i++) {
    const v = S.weather.layers[i], y = sy(CENTERS[i]), active = curAlt >= BANDS[i][0] && curAlt < BANDS[i][1];
    if (i > 0) { ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(0, sy(BANDS[i][0])); ctx.lineTo(W, sy(BANDS[i][0])); ctx.stroke(); ctx.setLineDash([]); }

$('saveCopy').onclick = () => {
  const ta = $('saveCode');
  navigator.clipboard.writeText(ta.value).then(() => { $('saveMsg').textContent = 'Kopyalandı.'; }).catch(() => { ta.focus(); ta.select(); $('saveMsg').textContent = 'Kod seçildi, kopyalamak için Ctrl+C / Kopyala.'; });
};
$('saveLoad').onclick = () => {
  try {
    const s = JSON.parse(decodeURIComponent(escape(atob($('saveCode').value.trim()))));
    if (!s || !s.balloons || !s.rivals) throw 0;
    S = s; tab = 'plan'; $('saveBox').hidden = true; startDay();
  } catch (e) { $('saveMsg').textContent = 'Bu kod okunamadı. Kodun tamamını yapıştırdığından emin ol.'; }
};
$('bNew').onclick = () => {
  const b = $('bNew');
  if (b.dataset.arm) { delete b.dataset.arm; b.textContent = 'Yeni oyun'; S = newState(); tab = 'plan'; startDay(); }
  else { b.dataset.arm = '1'; b.textContent = 'Emin misin? Tekrar dokun'; setTimeout(() => { if (b.dataset.arm) { delete b.dataset.arm; b.textContent = 'Yeni oyun'; } }, 3000); }
};
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now; T += dt;
  if (mode === 'flight') updateFlight(dt);
  draw(dt);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize();
S = load();
if (!S || !S.balloons || !S.balloons.length || S.over) S = newState();
startDay();
requestAnimationFrame(frame);
</script>
