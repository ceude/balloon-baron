<title>Derinkuyu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Commissioner:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one full-bleed canvas (story scenes, then a cross-section of the city); HUD on top, hint + sheet at the bottom */
:root{
  --night:#120a06;
  --tuff:#c89a6c;
  --ember:#f2a65a;
  --flame:#ffd38a;
  --cold:#9cc0d4;
  --blood:#e0664a;
  --text:#f3e6d4;
  --muted:#b9a288;
  --panel:rgba(22,13,8,.94);
  --line:rgba(242,166,90,.28);
  --display:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --ui:"Commissioner", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--text);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--flame);outline-offset:2px}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;
  padding:8px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px));
  background:linear-gradient(rgba(18,10,6,.82),rgba(18,10,6,.55));border-bottom:1px solid var(--line);z-index:3}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px}
.stat{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.stat .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.low .v{color:var(--blood)}
.ctrls{display:flex;gap:6px}
.ctrls button{background:rgba(242,166,90,.1);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;font-weight:500;min-width:34px}
.ctrls button.off{opacity:.45;text-decoration:line-through}

/* banner */
#banner{position:absolute;left:50%;transform:translateX(-50%);top:70px;z-index:4;max-width:min(520px,calc(100% - 32px));
  padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;text-align:center;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 8px 30px rgba(0,0,0,.5)}
#banner.warn{border-color:var(--blood);color:#ffd9cc;animation:pulse 1s ease-in-out infinite}
#banner.bad{border-color:var(--blood)}
#banner.good{border-color:#a7c48a}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(224,102,74,.35),0 8px 30px rgba(0,0,0,.5)}}

/* hint */
#hint{position:absolute;left:0;right:0;bottom:0;z-index:3;min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  font-family:var(--display);font-style:italic;font-size:16px;color:var(--flame);
  background:linear-gradient(rgba(18,10,6,0),rgba(18,10,6,.9) 40%)}

/* bottom sheet */
#sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;z-index:5;width:min(560px,calc(100% - 16px));
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--flame)}
#shClose{background:none;border:0;font-size:24px;line-height:1;padding:2px 8px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:9px 11px;border-radius:8px;
  background:rgba(242,166,90,.08);border:1px solid var(--line)}
.opt:not(:disabled):hover{background:rgba(242,166,90,.18)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt .on{font-weight:700;font-size:14px}
.opt .od{font-size:12px;color:var(--muted)}
.opt .oc{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ember);margin-top:3px}
.info p{margin:4px 0;font-size:14px;color:var(--muted)}
.info .st{color:var(--text);font-weight:500}
.info .st.bad{color:var(--blood)}

/* story */
#story{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:flex-end;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px))}
.st-top{position:absolute;top:12px;right:max(12px, env(safe-area-inset-right, 0px));display:flex;gap:8px}
.st-top button{background:rgba(0,0,0,.35);border:1px solid rgba(243,230,212,.25);border-radius:6px;padding:5px 11px;font-size:12px;color:var(--muted)}
#cap{margin:0 auto 14px;max-width:34ch;min-height:5.4em;font-family:var(--display);font-size:clamp(19px,4.6vw,27px);line-height:1.35;text-align:center;
  white-space:pre-line;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.9)}
#stNext{align-self:center;background:var(--ember);color:#1b0f08;border:0;border-radius:999px;padding:11px 26px;font-weight:700;font-size:15px;letter-spacing:.02em}

/* end */
#end{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:rgba(10,5,3,.78);
  padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px))}
.end-card{max-width:420px;text-align:center}
.end-card h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,7vw,44px);margin:0 0 10px;color:var(--flame);text-wrap:balance}
.end-card p{font-size:16px;line-height:1.5;color:var(--text);margin:0 0 22px}
.end-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.end-btns button{border-radius:999px;padding:10px 20px;font-weight:700;border:1px solid var(--ember);background:transparent}
.end-btns button:first-child{background:var(--ember);color:#1b0f08}
@media (prefers-reduced-motion: reduce){#banner.warn{animation:none}}
</style>

<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div class="stats">
      <div class="stat" id="sPop"><span class="k" data-i="pop"></span><span class="v"></span></div>
      <div class="stat" id="sFood"><span class="k" data-i="food"></span><span class="v"></span></div>
      <div class="stat" id="sOil"><span class="k" data-i="oil"></span><span class="v"></span></div>
      <div class="stat" id="sStone"><span class="k" data-i="stone"></span><span class="v"></span></div>
      <div class="stat" id="sDay"><span class="k" data-i="day"></span><span class="v"></span></div>
    </div>
    <div class="ctrls">
      <button id="bPause" aria-label="Pause">II</button>
      <button id="bSpeed">1×</button>
      <button id="bSound" data-i="sound"></button>
      <button id="bLang"></button>
    </div>
  </div>

  <div id="banner" hidden></div>
  <div id="hint" hidden></div>

  <div id="sheet" hidden>
    <div class="sh-head"><h2 id="shTitle"></h2><button id="shClose" aria-label="Close">×</button></div>
    <div id="shBody"></div>
  </div>

  <div id="story">
    <div class="st-top"><button id="stLang"></button><button id="stSkip" data-i="skip"></button></div>
    <p id="cap"></p>
    <button id="stNext"></button>
  </div>

  <div id="end" hidden>
    <div class="end-card">
      <h1 id="endTitle"></h1>
      <p id="endText"></p>
      <div class="end-btns"><button id="endRestart" data-i="restart"></button><button id="endStory" data-i="replay"></button></div>
    </div>
  </div>
</div>

<script>

/* ---------- text ---------- */

    badgeAir: "NO AIR", queued: "QUEUED", digging: "Digging",

    starving: "Food is gone! People are starving.",
    noOil: "Out of oil. The lamps went dark.",
    winT: "Spring has come",
    winX: "Your people survived the winter and {r} raids underground. The city reached {d} floors deep, with {p} people.",
    loseT: "The city fell silent",
    loseX: "No one is left. Perhaps a thousand years from now, someone will knock down a wall and find this place.",
    restart: "Play again", replay: "Watch the story", m: "m"

};
let lang = 'en';
try { lang = (navigator.language || 'en').toLowerCase().startsWith('tr') ? 'tr' : 'en'; } catch (e) {}
try { const s = localStorage.getItem('dk-lang'); if (s === 'tr' || s === 'en') lang = s; } catch (e) {}
function t(k, v) { let s = STR[lang][k] ?? k; if (v) for (const n in v) s = s.replace('{' + n + '}', v[n]); return s; }

/* ---------- helpers ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(a, b, k) { const A = hex(a), B = hex(b); return `rgb(${A.map((x, i) => Math.round(lerp(x, B[i], clamp(k, 0, 1)))).join(',')})`; }
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function ell(x, y, rx, ry, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), 0, 0, 7); ctx.fill(); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

/* ---------- audio ---------- */
let AC = null, soundOn = true;
function audioInit() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume().catch(() => {}); }
function noise(dur, freq, vol) {
  if (!AC || !soundOn) return;
  const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f).connect(g).connect(AC.destination); src.start();
}
function tone(f1, f2, dur, type, vol) {
  if (!AC || !soundOn) return;
  const o = AC.createOscillator(), g = AC.createGain(), now = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f1, now); o.frequency.exponentialRampToValueAtTime(f2, now + dur);
  g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(vol, now + .03); g.gain.exponentialRampToValueAtTime(.0001, now + dur);
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
  o.connect(f).connect(g).connect(AC.destination); o.start(now); o.stop(now + dur + .05);
}
function sfx(k) {
  if (k === 'thud') { noise(.3, 350, .7); tone(110, 40, .25, 'sine', .5); }
  if (k === 'dig') { noise(.12, 1200, .25); }
  if (k === 'done') { noise(.2, 600, .35); tone(160, 90, .15, 'sine', .25); }
  if (k === 'build') { tone(523, 523, .35, 'triangle', .12); setTimeout(() => tone(784, 784, .5, 'triangle', .1), 120); }
  if (k === 'door') { noise(1.3, 160, .6); tone(70, 45, 1.2, 'sine', .3); }
  if (k === 'horn') { tone(196, 174, 1.4, 'sawtooth', .09); setTimeout(() => tone(196, 147, 1.6, 'sawtooth', .09), 700); }
  if (k === 'wind') { noise(2.2, 500, .18); }
}

/* ---------- layout & textures ---------- */
function resize() {
  const r = $('wrap').getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height); DPR = Math.min(2, window.devicePixelRatio || 1);
  for (const c of [cv, lc]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  makeTuff(); layout();
}
function layout() {
  const hud = $('hud'), hudH = hud.hidden ? 0 : hud.offsetHeight, bottom = 50;
  const avail = H - hudH - bottom;
  const surfH = clamp(avail * .17, 60, 150);
  const gridTop = hudH + surfH;
  const cellH = (H - gridTop - bottom) / ROWS;
  const cellW = Math.min(W / COLS, cellH * 1.7);
  L = { hudH, surfH, gridTop, cellH, cellW, gridLeft: (W - cellW * COLS) / 2 };
  $('banner').style.top = (hudH + 10) + 'px';
}
function makeTuff() {
  const c = document.createElement('canvas'); c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
  const x = c.getContext('2d'); x.scale(DPR, DPR);
  x.fillStyle = '#b88a5e'; x.fillRect(0, 0, W, H);
  const R = mulberry32(7), n = Math.min(7000, Math.round(W * H / 350));
  for (let i = 0; i < n; i++) {
    const px = R() * W, py = R() * H, rad = 4 + R() * 28;
    x.fillStyle = R() < .5 ? `rgba(240,214,176,${.04 + R() * .07})` : `rgba(70,38,20,${.04 + R() * .07})`;
    x.beginPath(); x.ellipse(px, py, rad * 1.6, rad, 0, 0, 7); x.fill();
  }
  for (let y = 0; y < H; y += 8 + R() * 16) {
    x.strokeStyle = `rgba(80,45,25,${.05 + R() * .08})`; x.lineWidth = .6 + R() * 1.4;
    const ph = R() * 6, amp = 1 + R() * 3; x.beginPath();
    for (let px = 0; px <= W + 12; px += 12) { const yy = y + Math.sin(px * .012 + ph) * amp; px ? x.lineTo(px, yy) : x.moveTo(px, yy); }
    x.stroke();
  }
  const m = Math.min(12000, Math.round(W * H / 180));
  for (let i = 0; i < m; i++) { x.fillStyle = `rgba(50,25,12,${.12 + R() * .2})`; x.fillRect(R() * W, R() * H, .6 + R() * 1.2, .6 + R() * 1.2); }
  tuffTile = c;
}

/* ---------- shared drawing ---------- */
function chimney(x, base, w, h, col, cap) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x - w / 2, base);
  ctx.quadraticCurveTo(x - w * .32, base - h * .55, x - w * .13, base - h);
  ctx.lineTo(x + w * .13, base - h);
  ctx.quadraticCurveTo(x + w * .32, base - h * .55, x + w / 2, base);
  ctx.closePath(); ctx.fill();
  ell(x, base - h, w * .24, w * .1, cap);
  ell(x, base - h - w * .06, w * .14, w * .08, cap);
}
function chimneyRow(seed, base, maxH, n, col, cap, avoidX, avoidW) {
  const R = mulberry32(seed);
  for (let i = 0; i < n; i++) {
    const x = (i + .5) / n * W + (R() - .5) * W / n * .8, h = maxH * (.45 + R() * .55), w = h * (.36 + R() * .2);
    if (avoidX != null && Math.abs(x - avoidX) < avoidW) continue;
    chimney(x, base, w, h, col, cap);

    if (x.t === 'rock' && !x.job && adjacentOpen(r, c)) {
      ctx.setLineDash([4, 4]); ctx.strokeStyle = `rgba(242,166,90,${.18 + (G.flags.dug ? 0 : .35 * pulse)})`; ctx.lineWidth = 1.2;
      archPath(i); ctx.stroke(); ctx.setLineDash([]);
    }
    if (x.job) {
      const k = clamp(x.job.prog / x.job.dur, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(i.x0 + 4, i.y1 - 8, i.x1 - i.x0 - 8, 4);
      ctx.fillStyle = '#f2a65a'; ctx.fillRect(i.x0 + 4, i.y1 - 8, (i.x1 - i.x0 - 8) * k, 4);
      if (!x.job.active) { ctx.fillStyle = 'rgba(243,230,212,.7)'; ctx.font = '700 9px sans-serif'; ctx.fillText(t('queued'), i.x0 + 5, i.y0 + 14); }
    }
    if (!x.job && (x.t === 'ahir' || x.t === 'yag') && G.air[r] && G.air[r][c] < .45) {
      ctx.font = '700 9px sans-serif'; const s = t('badgeAir'), tw = ctx.measureText(s).width;
      ctx.fillStyle = 'rgba(30,50,70,.9)'; rr(i.x1 - tw - 10, i.y0 + 4, tw + 8, 14, 7); ctx.fill();
      ctx.fillStyle = '#cfe6f5'; ctx.fillText(s, i.x1 - tw - 6, i.y0 + 14);
    }
    if (x.t === 'gate' && G.raid.state === 'warn' && G.doorTarget === 0) {
      ctx.strokeStyle = `rgba(224,102,74,${.5 + .5 * pulse})`; ctx.lineWidth = 3; archPath(i); ctx.stroke();
    }
    if (sel && sel.r === r && sel.c === c && !$('sheet').hidden) { ctx.strokeStyle = '#ffd38a'; ctx.lineWidth = 2; archPath(i); ctx.stroke(); }
  }
  for (const f of G.fx) {
    f.life -= dt; f.y -= dt * 18;
    ctx.globalAlpha = clamp(f.life, 0, 1); ctx.fillStyle = '#ffd38a'; ctx.font = `700 13px ${getComputedStyle(document.documentElement).getPropertyValue('--ui')}`;
    ctx.textAlign = 'center'; ctx.fillText(f.s, f.x, f.y); ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
  G.fx = G.fx.filter(f => f.life > 0);
}

/* HUD, hint, banners, sheet */
const hudCache = {};
function setStat(id, v, low) { const el = $(id), k = v + (low ? '!' : ''); if (hudCache[id] === k) return; hudCache[id] = k; el.querySelector('.v').textContent = v; el.classList.toggle('low', !!low); }
function updateHUD(force) {
  if (force) for (const k in hudCache) delete hudCache[k];
  const cp = caps();
  setStat('sPop', `${G.pop}/${cp.pop}`, G.pop <= 2);
  setStat('sFood', `${Math.floor(G.res.food)}/${cp.food}`, G.res.food < 10);
  setStat('sOil', `${Math.floor(G.res.oil)}/${cp.oil}`, G.res.oil < 6);
  setStat('sStone', `${Math.floor(G.res.stone)}`, false);
  setStat('sDay', `${Math.min(WIN_DAY, Math.floor(G.day) + 1)}/${WIN_DAY}`, false);
  const h = currentHint(); if ($('hint').textContent !== h) $('hint').textContent = h;
}
function hasRoom(k) { return G.grid.some(row => row.some(x => x.t === k && !x.job)); }
function currentHint() {
  if (!G.flags.dug) return t('h1');
  if (!G.flags.built) return t('h2');
  if (G.flags.deep && !G.flags.baca) return t('h3');
  if (G.res.oil < 10 && !hasRoom('yag')) return t('h4');
  if (G.door > .5 && G.raid.state === 'none') return t('hClosed');
  return t('h5', { d: Math.min(WIN_DAY, Math.floor(G.day) + 1), w: WIN_DAY });
}
let bannerTimer = 0;
function banner(s, kind, ms) {
  const b = $('banner'); b.textContent = s; b.className = kind; b.hidden = false;
  clearTimeout(bannerTimer); if (ms) bannerTimer = setTimeout(hideBanner, ms);
}
function hideBanner() { $('banner').hidden = true; clearTimeout(bannerTimer); }
function costText(k) { const c = ROOMS[k], p = []; if (c.stone) p.push(`${c.stone} ${t('c_stone')}`); if (c.food) p.push(`${c.food} ${t('c_food')}`); return p.join(' · '); }
function openBuild(r, c) {
  sel = { r, c, kind: 'build' };
  $('shTitle').textContent = t('tunnel');
  const wrap = document.createElement('div'); wrap.className = 'opts';
  for (const k of BUILD) {
    const c0 = ROOMS[k], ok = (c0.stone || 0) <= G.res.stone && (c0.food || 0) <= G.res.food;
    const b = document.createElement('button'); b.className = 'opt'; b.disabled = !ok;
    b.innerHTML = `<span class="on"></span><span class="od"></span><span class="oc"></span>`;
    b.children[0].textContent = t(k); b.children[1].textContent = t(k + '_d'); b.children[2].textContent = costText(k);
    b.onclick = () => { startBuild(r, c, k); closeSheet(); };
    wrap.appendChild(b);
  }
  $('shBody').replaceChildren(wrap); $('sheet').hidden = false;
}
function openInfo(r, c) {
  sel = { r, c, kind: 'info' };
  const x = G.grid[r][c], k = x.job ? x.job.room : x.t;
  $('shTitle').textContent = t(k);
  const st = status(r, c), d = document.createElement('div'); d.className = 'info';
  const p1 = document.createElement('p'); p1.textContent = t(k + '_d');
  const p2 = document.createElement('p'); p2.className = 'st' + (st === 'works' || st === 'building' ? '' : ' bad'); p2.textContent = t(st);
  const p3 = document.createElement('p'); p3.textContent = `${t('air')}: ${Math.round(G.air[r][c] * 100)}%`;
  d.append(p1, p2, p3); $('shBody').replaceChildren(d); $('sheet').hidden = false;
}
function closeSheet() { $('sheet').hidden = true; sel = null; }

/* input */
cv.addEventListener('pointerdown', e => {
  audioInit();
  if (mode !== 'game' || !G || G.over) return;
  if (!$('sheet').hidden) { closeSheet(); return; }
  const rect = cv.getBoundingClientRect(), px = e.clientX - rect.left, py = e.clientY - rect.top;
  const gx = L.gridLeft + (GATE_C + .5) * L.cellW;
  if (py < L.gridTop && py > L.gridTop - L.surfH * .45 && Math.abs(px - gx) < L.cellW * .5) { toggleDoor(); return; }
  const c = Math.floor((px - L.gridLeft) / L.cellW), r = Math.floor((py - L.gridTop) / L.cellH);
  const x = cell(r, c); if (!x) return;
  if (x.t === 'gate') { toggleDoor(); return; }
  if (x.t === 'rock') {
    if (x.job) return;
    if (!adjacentOpen(r, c)) { banner(t('notAdj'), 'bad', 2000); return; }
    startDig(r, c); return;
  }
  if (x.job) { openInfo(r, c); return; }
  if (x.t === 'tunnel') openBuild(r, c); else openInfo(r, c);
});
$('shClose').onclick = closeSheet;
$('story').addEventListener('click', advance);
$('stNext').addEventListener('click', e => { e.stopPropagation(); advance(); });
$('stSkip').addEventListener('click', e => { e.stopPropagation(); audioInit(); startGame(); });
$('stLang').addEventListener('click', e => { e.stopPropagation(); switchLang(); });
$('bLang').onclick = switchLang;
$('bPause').onclick = () => { G.paused = !G.paused; $('bPause').textContent = G.paused ? '▶' : 'II'; };
$('bSpeed').onclick = () => { G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 3 : 1; $('bSpeed').textContent = G.speed + '×'; };
$('bSound').onclick = () => { soundOn = !soundOn; $('bSound').classList.toggle('off', !soundOn); };
$('endRestart').onclick = () => { startGame(); };
$('endStory').onclick = () => { startStory(); };

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t(el.dataset.i));
  $('bLang').textContent = t('lang'); $('stLang').textContent = t('lang');
  if (mode === 'story') { capFull = t('s' + (scene + 1)); $('stNext').textContent = scene === SCENES.length - 1 ? t('start') : t('next'); }
  if (mode === 'game' && G) updateHUD(true);
  closeSheet(); layout();
}
function switchLang() { lang = lang === 'tr' ? 'en' : 'tr'; try { localStorage.setItem('dk-lang', lang); } catch (e) {} applyLang(); }

/* loop */
let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(.1, Math.max(0, (now - last) / 1000)); last = now; T += dt;
  if (mode === 'story') drawStory(dt);
  else if (G) {
    if (!G.paused && !G.over) {
      tick(dt * G.speed);
      G.door = clamp(G.door + Math.sign(G.doorTarget - G.door) * dt * 1.1, 0, 1);
      if (Math.abs(G.door - G.doorTarget) < .02) G.door = G.doorTarget;
      updatePeople(dt * G.speed);
    }
    if (!G.air.length) computeAir();
    drawGame(dt); updateHUD();
  }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
applyLang(); resize(); startStory();
requestAnimationFrame(frame);
</script>
