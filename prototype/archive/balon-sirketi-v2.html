<title>Şafak Balon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: dawn sky canvas on top, a white "ground crew" sheet below with a big ignition button, icon tab bar at the very bottom */
:root{
  --ink:#2b2350;        /* dawn indigo: text */
  --ink2:#6c6488;       /* secondary text */
  --paper:#ffffff;
  --haze:#f1edf8;       /* row fill */
  --line:#e2dcef;
  --coral:#ff5e3a;      /* burner flame: primary */
  --coral-d:#d9411f;
  --sun:#ffc23d;
  --green:#22a45d; --yellow:#e0a400; --red:#e5432f;
  --body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --cond:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:#1b1840;color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.n{font-family:var(--cond);font-variant-numeric:tabular-nums;font-weight:700}

/* HUD chips over the sky */
#hud{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;gap:6px;
  padding:10px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px))}
.chip{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:rgba(255,255,255,.92);
  box-shadow:0 2px 0 rgba(43,35,80,.25);font-family:var(--cond);font-weight:700;font-size:18px;white-space:nowrap}
.chip.name{font-size:16px;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;background:rgba(43,35,80,.55);color:#fff;box-shadow:none}
.chip .fl{width:10px;height:10px;border-radius:50%}
.chip.neg{color:var(--red)}
#bMenu{width:34px;padding:0;justify-content:center}
#bMenu svg{width:18px;height:18px}

/* sheet */
#sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;z-index:5;width:min(560px,100%);height:min(64%,680px);
  display:flex;flex-direction:column;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -6px 30px rgba(20,10,40,.35)}
#sheet::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--line)}
#tabBody{flex:1;overflow-y:auto;padding:22px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:20px}
.act{padding:10px 16px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.est{font-size:13.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.est b{color:var(--ink);font-family:var(--cond);font-size:17px}
.btns{display:flex;gap:10px}
.big{flex:1;height:54px;border-radius:16px;background:var(--coral);color:#fff;font-family:var(--cond);font-weight:800;font-size:22px;letter-spacing:.01em;
  box-shadow:0 5px 0 var(--coral-d);transition:transform .06s, box-shadow .06s}
.big:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--coral-d)}
.big:disabled{background:#cfc8dd;box-shadow:0 5px 0 #b3aac6;cursor:not-allowed}
.ghost{height:54px;padding:0 16px;border-radius:16px;background:var(--haze);font-family:var(--cond);font-weight:700;font-size:18px;box-shadow:0 5px 0 var(--line)}
.ghost:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
nav{display:flex;border-top:1px solid var(--line);padding:4px max(8px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:11.5px;font-weight:600;color:var(--ink2);position:relative;border-radius:12px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--coral)}
nav button .dot{position:absolute;top:4px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* content blocks */
h2{margin:0;font-family:var(--cond);font-weight:700;font-size:22px;line-height:1.1}
.sec{display:flex;flex-direction:column;gap:10px}
.hint{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.weather{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.flagbig{width:58px;height:64px;position:relative}
.flagbig i{position:absolute;left:4px;top:0;width:4px;height:64px;border-radius:2px;background:var(--ink)}
.flagbig b{position:absolute;left:8px;top:3px;width:46px;height:30px;border-radius:0 6px 6px 0;animation:wave 2.2s ease-in-out infinite;transform-origin:left center}
@keyframes wave{50%{transform:skewY(-4deg) scaleX(.94)}}
.wtitle{font-family:var(--cond);font-weight:800;font-size:26px;line-height:1}
.wsub{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.4}
.ladder{display:flex;flex-direction:column;gap:4px;background:linear-gradient(#e8e2ff,#ffe6d2);border-radius:14px;padding:10px 12px}
.rung{display:grid;grid-template-columns:76px 1fr 64px;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2)}
.rung .track{position:relative;height:10px}
.rung .track::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(43,35,80,.18)}
.rung .arr{position:absolute;top:2px;height:6px;border-radius:3px;background:var(--ink)}
.rung .arr::after{content:"";position:absolute;top:-4px;border:7px solid transparent}
.rung .arr.r::after{right:-10px;border-left-color:var(--ink)}
.rung .arr.l::after{left:-10px;border-right-color:var(--ink)}
.rung .sp{font-family:var(--cond);font-weight:700;font-size:15px;color:var(--ink);text-align:right}
.callout{padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.45}
.callout.red{background:#fde6e2;color:#8c2414}
.callout.yel{background:#fff3cf;color:#6b4c00}
.callout.grn{background:#dcf3e5;color:#145c34}
.callout b{font-weight:700}
.callout .pbtn{display:block}
.pricebox{display:flex;align-items:flex-end;justify-content:space-between}
.pricebig{font-family:var(--cond);font-weight:800;font-size:40px;line-height:.9;color:var(--coral)}
input[type=range]{width:100%;accent-color:var(--coral);height:28px}
.rivalmarks{position:relative;height:22px;margin:-6px 0 0}
.rm{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-family:var(--cond);font-weight:700;font-size:12px;color:var(--ink2)}
.rm i{width:8px;height:8px;border-radius:50%;margin-bottom:1px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--haze)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;font-size:15.5px}
.item .s{font-size:13px;color:var(--ink2);margin-top:1px;line-height:1.35}
.ic{width:38px;height:38px;flex:none}
.av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:17px;color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;margin-left:4px;vertical-align:1px}
.tag.g{background:#dcf3e5;color:#145c34}.tag.y{background:#fff3cf;color:#6b4c00}.tag.r{background:#fde6e2;color:#8c2414}.tag.n{background:#fff;color:var(--ink2)}
.sw{width:50px;height:30px;border-radius:15px;background:#d4cde2;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--green)}
.sw[aria-pressed="true"]::after{transform:translateX(20px)}
.pbtn{height:38px;padding:0 14px;border-radius:12px;background:var(--ink);color:#fff;font-family:var(--cond);font-weight:700;font-size:16px;white-space:nowrap;box-shadow:0 3px 0 #17122f}
.pbtn.light{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.pbtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #17122f}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.sharebar{display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--haze)}
.sharebar span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{font-family:var(--cond)}
.rv .t{display:flex;align-items:center;gap:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.stats div{background:#fff;border-radius:10px;padding:5px 6px;text-align:center;font-size:11px;color:var(--ink2)}
.stats b{display:block;font-family:var(--cond);font-size:17px;color:var(--ink)}

/* modals */
.modal{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(27,24,64,.55);
  padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px))}
.card{width:min(420px,100%);max-height:100%;overflow-y:auto;background:var(--paper);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card h1{margin:0;font-family:var(--cond);font-weight:800;font-size:32px;line-height:1}
/* flight log ticket */
.ticket{width:min(420px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;filter:drop-shadow(0 20px 40px rgba(0,0,0,.35))}
.stub{background:var(--ink);color:#fff;border-radius:22px 22px 0 0;padding:18px 20px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.stub .d{font-family:var(--cond);font-weight:800;font-size:34px;line-height:.9}
.stub .m{font-size:13px;opacity:.75;margin-top:4px}
.perf{height:18px;background:radial-gradient(circle at 0 50%, transparent 9px, #fff 9.5px) left/51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 9px, #fff 9.5px) right/51% 100% no-repeat;position:relative}
.perf::after{content:"";position:absolute;left:16px;right:16px;top:50%;border-top:2px dashed var(--line)}
.tbody{background:#fff;border-radius:0 0 22px 22px;padding:6px 20px 20px;display:flex;flex-direction:column;gap:14px}
.led{display:flex;flex-direction:column;gap:5px;font-size:14.5px}
.led div{display:flex;justify-content:space-between;gap:10px}
.led .v{font-family:var(--cond);font-weight:700;font-size:17px}
.led .tot{border-top:2px solid var(--ink);padding-top:8px;margin-top:4px;font-weight:700}
.led .tot .v{font-size:22px}
.pos{color:var(--green)} .neg{color:var(--red)}
.ev{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.4}
.ev li{display:flex;gap:10px}
.ev li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--coral)}
.ev li.r{color:var(--ink2)}
.ev li.r::before{background:#c3bbd6}
.palette{display:flex;gap:12px}
.palette button{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--haze);border:3px solid transparent}
.palette button[aria-pressed="true"]{border-color:var(--ink)}
.field{height:50px;border-radius:14px;border:2px solid var(--line);padding:0 14px;font:600 18px var(--body);color:var(--ink);width:100%}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{padding:6px 10px;border-radius:10px;background:var(--haze);font-size:13.5px;font-weight:600}
textarea{width:100%;font:13px var(--body);border:2px solid var(--line);border-radius:12px;padding:10px;resize:vertical;color:var(--ink)}

/* flight */
#tip{position:absolute;left:50%;transform:translateX(-50%);bottom:max(20px, env(safe-area-inset-bottom, 0px));z-index:4;
  width:min(420px,calc(100% - 140px));text-align:left;font-size:14.5px;line-height:1.45;padding:12px 16px;border-radius:18px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#tip.wide{width:min(420px,calc(100% - 32px))}
#burn{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:max(22px, env(safe-area-inset-bottom, 0px));z-index:4;
  width:96px;height:96px;border-radius:50%;background:var(--coral);color:#fff;font-family:var(--cond);font-weight:800;font-size:18px;
  box-shadow:0 7px 0 var(--coral-d),0 10px 24px rgba(0,0,0,.3);touch-action:none;-webkit-user-select:none;user-select:none}
#burn.on{transform:translateY(5px);box-shadow:0 2px 0 var(--coral-d),0 0 0 8px rgba(255,194,61,.45)}
@media (prefers-reduced-motion: reduce){.flagbig b{animation:none}*{transition:none!important}}
</style>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="chip name" id="hName"></div>
    <div class="chip" id="hDay"></div>
    <div class="chip n" id="hCash"></div>
    <div class="chip n" id="hRep"></div>
    <button class="chip" id="bMenu" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="#2b2350" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>

  <div id="sheet">
    <div id="tabBody"></div>
    <div class="act" id="act">
      <div class="est" id="est"></div>
      <div class="btns"><button class="ghost" id="skip">Pas geç</button><button class="big" id="go"></button></div>
    </div>
    <nav id="nav" role="tablist"></nav>
  </div>

  <div id="tip" hidden></div>
  <button id="burn" hidden>BRÜLÖR</button>

  <div class="modal" id="report" hidden></div>
  <div class="modal" id="menu" hidden></div>
  <div class="modal" id="setup" hidden></div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1, T = 0;

/* ---------- constants ---------- */
const SIZES = {
  S: { cap: 8,  cost: 7000,  fuel: 60,  up: 40, risk: .8,  label: 'Küçük sepet' },
  M: { cap: 16, cost: 15000, fuel: 90,  up: 60, risk: 1,   label: 'Orta sepet' },
  L: { cap: 24, cost: 26000, fuel: 120, up: 80, risk: 1.3, label: 'Büyük sepet' }
};
const LEVELS = [null, { name: 'Çaylak', wage: 90, risk: 1.6 }, { name: 'Deneyimli', wage: 150, risk: 1 }, { name: 'Kıdemli', wage: 240, risk: .6 }];
const FLAGS = {
  green:  { name: 'Yeşil bayrak',   acc: .006, dem: 1,  wind: 1,    gust: .25, col: '#22a45d', note: 'Uçuşa uygun, rüzgâr hafif.' },
  yellow: { name: 'Sarı bayrak',    acc: .03,  dem: .9, wind: 1.45, gust: .9,  col: '#e0a400', note: 'Uçabilirsin ama kaza riski ve sigorta primleri yüksek.' },
  red:    { name: 'Kırmızı bayrak', acc: .14,  dem: 1,  wind: 2,    gust: 1.7, col: '#e5432f', note: 'Uçuş yasak. Kalkarsan yakalanabilirsin ve sigorta hiçbir şeyi ödemez.' }
};
const BANDS = [[0, 60], [60, 180], [180, 350], [350, 650]], CENTERS = [30, 120, 265, 500];
const B_NAMES = ['Şafak', 'Güvercin', 'Zelve', 'Uçhisar', 'Avanos', 'Ihlara', 'Ortahisar', 'Kızılçukur', 'Paşabağ', 'Erciyes', 'Soğanlı', 'Mustafapaşa', 'Göreme', 'Çavuşin', 'Ürgüp', 'Sinasos'];
const P_NAMES = ['Mert', 'Elif', 'Kerem', 'Zeynep', 'Hakan', 'Selin', 'Burak', 'Derya', 'Emre', 'Aslı', 'Onur', 'Ceren', 'Tolga', 'Melis', 'Cem', 'İpek'];
const LOANS = [
  { amt: 10000, days: 40, inst: 300, need: 0 },
  { amt: 25000, days: 45, inst: 650, need: 2 },
  { amt: 50000, days: 50, inst: 1250, need: 3 }
];
const PALETTES = [['#ff5e3a', '#ffc23d'], ['#14a39a', '#e8fff9'], ['#2b2350', '#ffc23d'], ['#ff6fa8', '#fff0f6']];
const LICENSE_DAYS = 15, RECERT = 1500, PRICE_MIN = 40, PRICE_MAX = 320;
const SIM = 6;

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const eur = n => (n < 0 ? '−€' : '€') + Math.abs(Math.round(n)).toLocaleString('tr-TR');
const pct = n => '%' + (n * 100).toLocaleString('tr-TR', { maximumFractionDigits: 1 });
const stars = r => clamp(3 + (r - .75) * 4, 1, 5).toLocaleString('tr-TR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '★';
function hex(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(a, b, k) { const A = hex(a), B = hex(b); k = clamp(k, 0, 1); return '#' + A.map((x, i) => Math.round(lerp(x, B[i], k)).toString(16).padStart(2, '0')).join(''); }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- state ---------- */
let S = null;
function newState() {
  const s = {
    day: 1, cash: 3000, rep: 1, price: 170, strikes: 0, banUntil: 0, selfFly: true, nextId: 1, lastSelfFly: 1,
    company: '', colors: PALETTES[0],
    ins: { hull: true, pax: true }, balloons: [], pilots: [], candidates: [], loans: [], demandBase: 165,
    rivals: [
      { name: 'Göreme Sky',        col: '#5aa9e6', col2: '#eaf4fc', style: 'safe',  balloons: ['L', 'L', 'M', 'M', 'M'], price: 195, rep: 1.15, cash: 40000 },
      { name: 'Peribaca Balloons', col: '#9b7be0', col2: '#f2ebff', style: 'mid',   balloons: ['M', 'M', 'S'],           price: 165, rep: 1,    cash: 12000 },
      { name: 'Kızıl Vadi Air',    col: '#c73a2a', col2: '#ffd9a8', style: 'risky', balloons: ['S', 'S'],                price: 135, rep: .85,  cash: 5000 }
    ],
    lastShare: null, monopolyShown: false, over: false, tutorialDone: false
  };
  s.rivals.forEach(r => { r.alive = true; r.dmg = r.balloons.map(() => 0); r.lastPax = 0; r.lastCap = 0; r.forSale = null; r.lowDays = 0; });
  s.balloons.push({ id: s.nextId++, size: 'S', name: 'Şafak', fly: true, dmgUntil: 0, pilot: null });
  s.flag = s.balloons[0].id;
  return s;
}
function migrate(s) {
  if (s.lastSelfFly == null) s.lastSelfFly = s.day;
  if (!s.colors) s.colors = PALETTES[0];
  if (s.company == null) s.company = '';
  s.rivals.forEach(r => { if (r.lowDays == null) r.lowDays = 0; });
  return s;
}
const KEY = 'safak-balon-v1';
let savedOk = false;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); savedOk = true; } catch (e) { savedOk = false; } }
function load() { try { const j = localStorage.getItem(KEY); return j ? JSON.parse(j) : null; } catch (e) { return null; } }
const myCol = () => S.colors || PALETTES[0];

/* ---------- weather & world ---------- */
function newWeather() {
  const r = Math.random(), flag = S.day === 1 ? 'green' : r < .55 ? 'green' : r < .85 ? 'yellow' : 'red', F = FLAGS[flag];
  const surf = flag === 'green' ? rnd(3, 10) : flag === 'yellow' ? rnd(11, 18) : rnd(19, 30);
  const L = [(Math.random() < .5 ? -1 : 1) * surf / 3.6 * .45, rnd(-4, 4) * F.wind, rnd(-6, 6) * F.wind, rnd(-8, 8) * F.wind];
  if (!L.some(v => v > 3)) { const i = 1 + Math.floor(Math.random() * 3); L[i] = rnd(3.5, 6) * F.wind; }
  if (!L.some(v => v < -.5)) { let m = 0; L.forEach((v, i) => { if (v < 3 && (L[m] >= 3 || v < L[m])) m = i; }); L[m] = -rnd(1, 4) * F.wind; }
  return { flag, surf: Math.round(surf), layers: L, target: 220 + rnd(1300, 2100), seed: Math.floor(Math.random() * 1e9) };
}
function windAt(alt, t) {
  const Wx = S.weather, Ls = Wx.layers, g = FLAGS[Wx.flag].gust;
  let v;
  if (alt <= CENTERS[0]) v = Ls[0];

}

}

/* ---------- flight ---------- */
function startFlight(pax) {
  FL = { x: 220, alt: 0, vx: 0, vy: 0, heat: .42, fuel: 100, t: 0, air: false, done: false, burning: false, pax, msg: 0 };
  mode = 'flight'; $('sheet').hidden = true; $('burn').hidden = false;
  const tip = $('tip'); tip.hidden = false; tip.className = '';
  tip.innerHTML = S.tutorialDone ? `<b>${pax} yolcu sepette.</b> İniş alanı doğuda.` : '<b>Brülöre basılı tut:</b> balon ısınır ve yükselir. <b>Bırak:</b> soğur ve alçalır. Her yükseklikte rüzgâr farklı eser. Seni sağa taşıyan katmanı bul ve iniş alanına yavaşça in.';
}
function setBurn(on) { if (mode !== 'flight' || !FL || FL.done) return; FL.burning = on; $('burn').classList.toggle('on', on); if (on && FL.t > 1 && !FL.msg) $('tip').hidden = true; }

  f.alt += f.vy * s;

  if (f.alt > 1) { f.vx += (w - f.vx) * (1 - Math.exp(-s / 6)); f.x += f.vx * s; }
  f.t += s;
  if (f.alt > 15 && !f.air) { f.air = true; if (!S.tutorialDone) $('tip').hidden = true; }
  if (f.air) {
    const th = terrainH(f.x);
    if (th > 4 && f.alt < th) return land('crash');
    if (f.alt <= 0) { f.alt = 0; return land(-f.vy > 2.6 ? 'hard' : null); }
  }
  if (f.air && f.alt > 0 && f.fuel <= 0 && !f.msg) { f.msg = 1; $('tip').hidden = false; $('tip').innerHTML = '<b>Yakıt bitti!</b> Balon soğuyarak iniyor.'; }
}
function land(q) {
  const f = FL; f.done = true; f.burning = false; $('burn').classList.remove('on'); $('burn').hidden = true;
  f.dist = Math.abs(f.x - S.weather.target);
  if (!q) q = f.dist < 70 ? 'perfect' : f.dist < 260 ? 'good' : 'far';
  S.tutorialDone = true;
  const msg = {
    perfect: '<b>Kusursuz iniş!</b> İniş alanının tam ortası.',
    good: '<b>İyi iniş.</b> Yer ekibi seni hemen buldu.',
    far: `<b>Hedeften ${Math.round(f.dist)} m uzağa indin.</b> Yolcular bir saat beklemek zorunda kaldı.`,
    hard: '<b>Sert iniş!</b> Sepet devrildi, yolcularda hafif yaralanmalar var.',
    crash: '<b>Peribacasına çarptın!</b> Balon ağır hasarlı, yolcular yaralı.'
  }[q];
  const tip = $('tip'); tip.hidden = false; tip.className = 'wide'; tip.replaceChildren(h('div', null, msg));
  const b = h('button', 'big', 'Gün sonu raporu'); b.style.cssText = 'width:100%;margin-top:12px'; b.onclick = () => finishDay({ q, dist: f.dist }); tip.appendChild(b);
}
$('burn').addEventListener('pointerdown', ev => { ev.preventDefault(); setBurn(true); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(e => $('burn').addEventListener(e, () => setBurn(false)));
cv.addEventListener('pointerdown', () => setBurn(true));
['pointerup', 'pointercancel', 'pointerleave'].forEach(e => cv.addEventListener(e, () => setBurn(false)));
window.addEventListener('keydown', e => { if (e.code === 'Space' && mode === 'flight') { e.preventDefault(); setBurn(true); } });
window.addEventListener('keyup', e => { if (e.code === 'Space') setBurn(false); });

/* ---------- rendering ---------- */
function resize() {
  const r = $('wrap').getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height); DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
function ell(x, y, rx, ry, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), 0, 0, 7); ctx.fill(); }
function rrect(x, y, w, hh, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r); ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function balloon(x, y, R, c1, c2, burn, alpha) {
  ctx.save(); ctx.globalAlpha = alpha ?? 1;

  ctx.beginPath(); ctx.arc(x, cy, R, Math.PI * .85, Math.PI * .15, false);
  ctx.quadraticCurveTo(x + R * .75, cy + R * 1.15, x + R * .22, cy + R * 1.55); ctx.lineTo(x - R * .22, cy + R * 1.55);
  ctx.quadraticCurveTo(x - R * .75, cy + R * 1.15, x - R * Math.cos(Math.PI * .15), cy + R * Math.sin(Math.PI * .15));

  const g = ctx.createLinearGradient(x - R, 0, x + R, 0); g.addColorStop(0, 'rgba(255,255,255,.18)'); g.addColorStop(.6, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(40,10,40,.35)');

  ctx.fillStyle = '#6b4426'; ctx.fillRect(x - R * .3, bb, R * .6, R * .32);
  if (burn) { const f = 1 + Math.sin(T * 40) * .2; ell(x, by + R * .02, R * .1, R * .28 * f, 'rgba(255,200,90,.95)'); ell(x, by + R * .06, R * .05, R * .14 * f, '#fff4cc'); }
  ctx.restore();
}
function draw(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!S || !S.weather) { ctx.fillStyle = '#1b1840'; ctx.fillRect(0, 0, W, H); return; }
  const f = FL && mode === 'flight' ? FL : null;
  const p = f ? clamp(f.t / 420, 0, 1) * .85 + .1 : .12 + Math.sin(T * .05) * .02;
  const top = $('hud').offsetHeight + 6;
  const sheetH = !$('sheet').hidden ? $('sheet').offsetHeight : 0;
  const groundY = f ? H * .86 : Math.max(H * .3, H - sheetH + 6), topY = top + 34;
  const ky = (groundY - topY) / 650, kx = clamp(W / 900, .4, 1.4);
  const focusX = f ? f.x : 220 + Math.sin(T * .03) * 40;
  const camX = focusX - (W * .36) / kx;
  const sx = wx => (wx - camX) * kx, sy = a => groundY - a * ky;
  const myc = myCol();

  const g = ctx.createLinearGradient(0, 0, 0, groundY);
  g.addColorStop(0, mix('#1b1840', '#5f8fc6', p)); g.addColorStop(.55, mix('#6b3e6e', '#f0b48c', p)); g.addColorStop(1, mix('#f08a4a', '#ffe2ac', p));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, groundY);
  const sunX = W * .7 - camX * kx * .02, sunY = groundY - (groundY - topY) * (.04 + p * .5), sr = Math.min(W, H) * .05;
  const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sr * 6); sg.addColorStop(0, 'rgba(255,220,150,.55)'); sg.addColorStop(1, 'rgba(255,200,140,0)');
  ctx.fillStyle = sg; ctx.fillRect(sunX - sr * 6, sunY - sr * 6, sr * 12, sr * 12); ell(sunX, sunY, sr, sr, '#fff0c8');

  const vh = groundY - topY;
  ctx.fillStyle = mix('#4a3050', '#c9967e', p);
  ctx.beginPath(); ctx.moveTo(0, groundY);
  for (let x = -20; x <= W + 40; x += 40) { const wx = (x / kx + camX * .15) * .01; ctx.lineTo(x, groundY - vh * (.11 + .06 * Math.sin(wx * 1.7) + .035 * Math.sin(wx * 4.3))); }
  ctx.lineTo(W, groundY); ctx.closePath(); ctx.fill();
  const R = mulberry32(5);
  for (let i = 0; i < 40; i++) {
    const wx = i * 130 + R() * 60 - 600, x = (wx - camX * .45) * kx, hh = vh * (.07 + R() * .1), ww = hh * (.4 + R() * .2);
    if (x < -60 || x > W + 60) continue;
    chimney(x, groundY + 2, ww, hh, mix('#5c3a4a', '#d9a07a', p), null, mix('#3e2836', '#9a6448', p));
  }
  for (const b of bgBalloons) {
    b.x += windAt(b.alt, T * 6) * dt * (f ? SIM : 2);
    if (b.x > camX + W / kx + 900) b.x = camX - 600; if (b.x < camX - 900) b.x = camX + W / kx + 500;
    const yy = sy(b.alt + Math.sin(T * .4 + b.ph) * 6), xx = sx(b.x);
    if (xx > -50 && xx < W + 50) balloon(xx, yy, Math.max(7, vh * .045 * b.s), b.c[0], b.c[1], false, .92);
  }
  const gg = ctx.createLinearGradient(0, groundY, 0, H); gg.addColorStop(0, mix('#5a3a32', '#c48a62', p)); gg.addColorStop(1, mix('#2e1e22', '#7a5040', p));
  ctx.fillStyle = gg; ctx.fillRect(0, groundY, W, H - groundY);
  const tx = S.weather.target, lzx0 = sx(tx - 70), lzx1 = sx(tx + 70);
  ctx.fillStyle = mix('#4b5a34', '#a7b46a', p); ctx.fillRect(lzx0, groundY - 2, lzx1 - lzx0, 7);
  for (const fx of [tx - 70, tx + 70]) { const X = sx(fx); ctx.strokeStyle = '#2a1a14'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(X, groundY); ctx.lineTo(X, groundY - 22); ctx.stroke(); ctx.fillStyle = '#ffc23d'; ctx.beginPath(); ctx.moveTo(X, groundY - 22); ctx.lineTo(X + 11, groundY - 18); ctx.lineTo(X, groundY - 14); ctx.fill(); }
  const trx = sx(tx + 35); ctx.fillStyle = '#f2eee6'; ctx.fillRect(trx, groundY - 13, 22, 9); ctx.fillRect(trx + 14, groundY - 18, 9, 6); ctx.fillStyle = '#7b5a3c'; ctx.fillRect(trx - 18, groundY - 10, 16, 6);
  ell(trx + 4, groundY - 3, 3, 3, '#1d1418'); ell(trx + 18, groundY - 3, 3, 3, '#1d1418'); ell(trx - 10, groundY - 3, 3, 3, '#1d1418');
  const lx = sx(220); ctx.fillStyle = mix('#5c4a3a', '#b9996e', p); ctx.fillRect(lx - 40, groundY - 1, 80, 4);
  for (const c of terrain) {
    const x = sx(c.x); if (x < -80 || x > W + 80) continue;
    chimney(x, groundY + 1, c.w * kx, c.h * ky, mix(mix('#6a4038', '#e2b48a', p), '#d6a27a', c.tone * .3), mix('#4a2c2a', '#b07a58', p), mix('#3a2420', '#7e5038', p));
  }
  const PR = Math.max(12, vh * .065);
  if (f) {
    const curAlt = f.alt;
    ctx.font = '700 13px "Barlow Condensed", system-ui, sans-serif';
    for (let i = 0; i < 4; i++) {
      const v = S.weather.layers[i], y = sy(CENTERS[i]), active = curAlt >= BANDS[i][0] && curAlt < BANDS[i][1];
      if (i > 0) { ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.setLineDash([4, 6]); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, sy(BANDS[i][0])); ctx.lineTo(W, sy(BANDS[i][0])); ctx.stroke(); ctx.setLineDash([]); }
      const len = 12 + Math.abs(v) * 5, x0 = 14, dir = Math.sign(v) || 1, ax0 = dir > 0 ? x0 : x0 + len, ax1 = dir > 0 ? x0 + len : x0;
      ctx.fillStyle = active ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.35)';
      rrect(6, y - 13, 112, 26, 13); ctx.fill();
      ctx.strokeStyle = ctx.fillStyle = active ? '#ff5e3a' : '#2b2350'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ax0, y); ctx.lineTo(ax1, y); ctx.stroke();

      ctx.fillStyle = '#2b2350'; ctx.fillText(`${Math.round(Math.abs(v) * 3.6)} km/s`, 70, y + 5);
    }
    balloon(sx(f.x), sy(f.alt), PR * .75, myc[0], myc[1], f.burning && f.fuel > 0);
    const dx = tx - f.x, tsx = sx(tx);

      ctx.font = '700 15px "Barlow Condensed", system-ui, sans-serif';

    ctx.fillText('İrtifa', ix + 12, iy + 18); ctx.fillText('Dikey', ix + 72, iy + 18);
    ctx.fillStyle = '#2b2350'; ctx.font = '800 22px "Barlow Condensed", system-ui, sans-serif';
    ctx.fillText(`${Math.round(f.alt)} m`, ix + 12, iy + 40);
    ctx.fillStyle = Math.abs(f.vy) > 2.6 && f.vy < 0 ? '#e5432f' : '#2b2350';
    ctx.fillText(`${f.vy >= 0 ? '↑' : '↓'}${Math.abs(f.vy).toFixed(1)}`, ix + 72, iy + 40);
    ctx.fillStyle = '#6c6488'; ctx.font = '600 11px Barlow, system-ui, sans-serif'; ctx.fillText('Yakıt', ix + 12, iy + 62);
    ctx.fillStyle = '#ece7f4'; rrect(ix + 12, iy + 68, iw - 24, 10, 5); ctx.fill();
    ctx.fillStyle = f.fuel < 20 ? '#e5432f' : '#ff5e3a'; if (f.fuel > 1) { rrect(ix + 12, iy + 68, (iw - 24) * f.fuel / 100, 10, 5); ctx.fill(); }

}

/* ---------- boot ---------- */
$('go').onclick = () => launch(false);
$('skip').onclick = () => launch(true);
$('bMenu').onclick = showMenu;
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now; T += dt;
  if (mode === 'flight') updateFlight(dt);

  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize();
S = load();
if (!S || !S.balloons || !S.balloons.length || S.over) S = newState(); else S = migrate(S);
