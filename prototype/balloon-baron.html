<title>Şafak Balon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: dawn sky canvas on top, a white "ground crew" sheet below with a big ignition button, icon tab bar at the very bottom */
:root{
  --ink:#2b2350;        /* dawn indigo: text */
  --ink2:#6c6488;       /* secondary text */
  --paper:#ffffff;
  --haze:#f1edf8;       /* row fill */
  --line:#e2dcef;
  --coral:#ff5e3a;      /* burner flame: primary */
  --coral-d:#d9411f;
  --sun:#ffc23d;
  --glass:rgba(30,24,64,.84);
  --green:#22a45d; --yellow:#e0a400; --red:#e5432f;
  --body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --cond:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:#1b1840;color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;display:block;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.n{font-family:var(--cond);font-variant-numeric:tabular-nums;font-weight:700}

/* HUD chips over the sky */
#hud{position:absolute;top:0;left:0;right:0;z-index:7;display:flex;align-items:center;gap:6px;
  padding:10px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px))}
.chip{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:rgba(255,255,255,.92);
  box-shadow:0 2px 0 rgba(43,35,80,.25);font-family:var(--cond);font-weight:700;font-size:18px;white-space:nowrap}
.chip.name{font-size:16px;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;background:rgba(43,35,80,.55);color:#fff;box-shadow:none}
.chip .fl{width:10px;height:10px;border-radius:50%}
.chip.neg{color:var(--red)}
#bMenu{width:34px;padding:0;justify-content:center}
#bMenu svg{width:18px;height:18px}

/* home: world full screen, glass widgets on top */
#sheet{position:absolute;inset:0;z-index:5;pointer-events:none}
#sheet > *{pointer-events:auto}
.wxw{position:absolute;left:max(12px, env(safe-area-inset-left, 0px));width:204px;padding:10px 12px;border-radius:18px;background:var(--glass);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.wxh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.flagmini{width:14px;height:22px;border-radius:2px 5px 5px 2px;box-shadow:-3px 0 0 #fff;margin-left:3px}
.wxt{font-family:var(--cond);font-weight:800;font-size:19px;line-height:1}
.wxs{font-size:12px;opacity:.75}
.lr{display:grid;grid-template-columns:60px 1fr 22px;gap:6px;align-items:center;font-size:11px}
.lr span:first-child{opacity:.7}
.lr b{font-family:var(--cond);font-size:14px;text-align:right}
.lt{position:relative;height:8px}
.lt::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.3)}
.lt i{position:absolute;top:2px;height:4px;border-radius:2px;background:var(--sun)}
.lt i::after{content:"";position:absolute;top:-4px;border:6px solid transparent}
.lt i.r::after{right:-8px;border-left-color:var(--sun)}
.lt i.l::after{left:-8px;border-right-color:var(--sun)}
.side{position:absolute;right:max(10px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:10px}
.side button{width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:11.5px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6);position:relative}
.side .ib{width:50px;height:50px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 rgba(43,35,80,.4)}
.side button:active .ib{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,35,80,.4)}
.side svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.side .dot{position:absolute;top:-3px;right:0;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid #fff}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px, env(safe-area-inset-bottom, 0px));width:min(560px,calc(100% - 16px));
  padding:12px;border-radius:24px;background:var(--glass);color:#fff;display:flex;flex-direction:column;gap:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(10,5,30,.4)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alerts:empty{display:none}
.alert{font-size:13px;line-height:1.35;padding:7px 10px;border-radius:10px;text-align:left;color:#fff}
.alert.red{background:rgba(229,67,47,.92)}
.alert.yel{background:rgba(255,194,61,.95);color:#2b1d00}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:5px}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 6px;border-radius:16px;min-width:156px;text-align:left;background:rgba(255,255,255,.1);box-shadow:0 4px 0 rgba(0,0,0,.28);color:#fff;position:relative}
.fchip .ic{width:32px;height:32px}
.fchip .fc{display:flex;flex-direction:column;line-height:1.25;font-size:11.5px}
.fchip .fc b{font-size:14.5px}
.fchip .fc span{opacity:.85}
.fchip .fstate{position:absolute;top:7px;right:9px;font-family:var(--cond);font-weight:800;font-size:11px;letter-spacing:.04em;opacity:.8}
.fchip.on{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--coral)}
.fchip.on .fstate{color:var(--coral);opacity:1}
.fchip.off .ic{filter:grayscale(.85);opacity:.55}
.fchip.blocked{background:rgba(255,255,255,.05);box-shadow:none;opacity:.8}
.fchip:active{transform:translateY(3px)}
.fsum{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 6px;border-radius:16px;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--coral);text-align:left}
.fsum.warn{box-shadow:0 4px 0 var(--sun)}
.fsum .ic{width:32px;height:32px;flex:none}
.fsum .fc{flex:1;display:flex;flex-direction:column;line-height:1.3;font-size:12px;min-width:0}
.fsum .fc b{font-size:15px}
.fsum .fc span{color:var(--ink2)}
.fsum .fgo{font-family:var(--cond);font-weight:800;font-size:15px;color:var(--coral);flex:none}
.fsum:active{transform:translateY(3px)}
.fplan{gap:8px}
.fplan .btns{margin-bottom:4px}
.fgh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--ink2)}
.fgh b{color:var(--ink)}
.fgb{display:flex;gap:6px;flex:none}
.fgb button{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:9px;background:var(--haze);color:var(--ink)}
.frow{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:14px;background:var(--haze)}
.frow .ic{width:28px;height:28px;flex:none}
.frow .main{flex:1;min-width:0}
.frow .t{font-weight:700;font-size:14.5px}
.frow .s{font-size:12.5px;color:var(--ink2)}
.frow.off .ic{filter:grayscale(.85);opacity:.55}
.flybtn{flex:none;min-width:84px;height:36px;padding:0 12px;border-radius:12px;font-family:var(--cond);font-weight:800;font-size:15px;letter-spacing:.04em;background:#e4deef;color:var(--ink2);box-shadow:0 3px 0 #c9c1db}
.flybtn.on{background:var(--coral);color:#fff;box-shadow:0 3px 0 #c7381a}
.whofly{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:16px;background:#fff3e8;font-size:13px;color:var(--ink2)}
.whofly b{color:var(--ink);font-size:15px}
.whob{display:flex;gap:8px;margin-top:4px}
.whob .flybtn{flex:1}
.flybtn:active{transform:translateY(3px);box-shadow:none}
.frow.blocked{opacity:.7}
.rd{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 3px 0 5px}
.rd.g{background:#3ad07a}.rd.y{background:var(--sun)}.rd.r{background:#ff6b55}
.ochip{flex:none;display:flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 6px;border-radius:12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.1);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.ochip .ck{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.15);font-weight:800}
.ochip.on{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--green)}
.ochip.on .ck{background:var(--green);color:#fff}
.ochip:active{transform:translateY(2px)}
.pricer{display:flex;align-items:center;gap:10px}
.rb{width:52px;height:52px;border-radius:16px;background:#fff;color:var(--ink);font-family:var(--cond);font-weight:800;font-size:30px;line-height:1;box-shadow:0 4px 0 rgba(0,0,0,.3);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.pmid{flex:1;text-align:center}
.pl{font-size:12px;opacity:.75}
.pmid .pricebig{color:var(--sun);font-size:38px}
.prv{display:flex;justify-content:center;gap:10px;font-family:var(--cond);font-weight:700;font-size:13px;opacity:.85;margin-top:3px}
.prv i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.dock .est,.psh .est{color:rgba(255,255,255,.8)}
.dock .est b,.psh .est b{color:#fff}
.pcard{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.1);color:#fff;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.pcard:active{transform:translateY(3px)}
.pcard .pp{display:flex;flex-direction:column;line-height:1.05}
.pcard .pp small{font-size:11px;opacity:.7}
.pcard .pp b{font-family:var(--cond);font-weight:800;font-size:28px;color:var(--sun)}
.pcard .pf{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;opacity:.9}
.pcard .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.pcard .bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.pcard .pgo{font-family:var(--cond);font-weight:800;font-size:15px;color:var(--sun)}
#psheet{position:absolute;inset:0;z-index:7;background:rgba(20,15,45,.45);display:flex;align-items:flex-end;justify-content:center}
.psh{width:min(560px,calc(100% - 16px));margin-bottom:max(10px, env(safe-area-inset-bottom, 0px));padding:16px;border-radius:24px;background:var(--glass);color:#fff;display:flex;flex-direction:column;gap:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:pgin .2s ease-out}
.pshh{display:flex;align-items:center;justify-content:space-between;font-family:var(--cond);font-size:22px}
.psh .pclose{background:rgba(255,255,255,.15);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:rgba(255,255,255,.08);border-radius:14px;padding:8px 6px;text-align:center}
.tile b{display:block;font-family:var(--cond);font-weight:800;font-size:24px;line-height:1.05}
.tile span{font-size:11.5px;opacity:.75}
.feel{display:flex;flex-direction:column;gap:6px}
.fl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;opacity:.9}
.fl.sm{font-size:11px;opacity:.6;margin-top:-2px}
.fl b{font-family:var(--cond);font-size:20px}
.fl b.g{color:#5ee08f}.fl b.y{color:var(--sun)}.fl b.o{color:#ff9a4d}.fl b.r{color:#ff6b55}
.meter{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#3ad07a 0%,#3ad07a 18%,#ffc23d 32%,#ffc23d 43%,#ff8a3d 57%,#ff8a3d 68%,#ff5540 82%)}
.meter i{position:absolute;top:-4px;width:6px;height:18px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5);transition:left .15s}
.mood{margin:2px 0 0;font-size:13px;line-height:1.4;opacity:.85;text-align:left}
.mood b{font-family:var(--cond);font-size:15px}
.res{display:flex;justify-content:space-between;align-items:flex-end;width:100%}
.res div{display:flex;flex-direction:column}
.res .rr{text-align:right;align-items:flex-end}
.psh .res b{font-family:var(--cond);font-weight:800;font-size:30px;color:#fff;line-height:1}
.res span{font-size:12px;opacity:.75}
.res em{font-style:normal;font-weight:700}
.res em.up{color:#5ee08f}.res em.dn{color:#ff6b55}
.psh .est{flex-direction:column;gap:8px}
.bar.big{height:9px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;width:100%}
.bar.big i{display:block;height:100%;background:var(--green)}
.alert.more{background:rgba(255,255,255,.1);font-weight:700;text-align:center}
.dock .ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3)}
#page{position:absolute;inset:0;z-index:6;background:#f6f3fb;display:flex;flex-direction:column;animation:pgin .22s ease-out}
@keyframes pgin{from{transform:translateY(24px);opacity:.4}}
.phead{display:flex;align-items:center;justify-content:space-between;padding:12px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px))}
.phead h1{margin:0;font-family:var(--cond);font-weight:800;font-size:34px}
.pclose{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--line);font-size:20px;font-weight:700}
#tabBody{flex:1;overflow-y:auto;padding:8px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:20px}
#page .item{background:#fff;box-shadow:0 2px 0 var(--line)}
.sw8{width:66px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:13px;flex:none}
.sw8.none{background:var(--haze);color:var(--ink2)}
.adbtn{margin-top:8px;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;background:var(--haze);box-shadow:0 2px 0 var(--line);font-size:13px;font-weight:600}
.adbtn i{width:10px;height:10px;border-radius:3px}
.act{padding:10px 16px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.est{font-size:13.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.est b{color:var(--ink);font-family:var(--cond);font-size:17px}
.btns{display:flex;gap:10px}
.big{flex:1;height:54px;border-radius:16px;background:var(--coral);color:#fff;font-family:var(--cond);font-weight:800;font-size:22px;letter-spacing:.01em;
  box-shadow:0 5px 0 var(--coral-d);transition:transform .06s, box-shadow .06s}
.big:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--coral-d)}
.big:disabled{background:#cfc8dd;box-shadow:0 5px 0 #b3aac6;cursor:not-allowed}
.ghost{height:54px;padding:0 16px;border-radius:16px;background:var(--haze);font-family:var(--cond);font-weight:700;font-size:18px;box-shadow:0 5px 0 var(--line)}
.ghost:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
nav{display:flex;border-top:1px solid var(--line);padding:4px max(8px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:11.5px;font-weight:600;color:var(--ink2);position:relative;border-radius:12px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--coral)}
nav button .dot{position:absolute;top:4px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* content blocks */
h2{margin:0;font-family:var(--cond);font-weight:700;font-size:22px;line-height:1.1}
.sec{display:flex;flex-direction:column;gap:10px}
.hint{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.weather{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.flagbig{width:58px;height:64px;position:relative}
.flagbig i{position:absolute;left:4px;top:0;width:4px;height:64px;border-radius:2px;background:var(--ink)}
.flagbig b{position:absolute;left:8px;top:3px;width:46px;height:30px;border-radius:0 6px 6px 0;animation:wave 2.2s ease-in-out infinite;transform-origin:left center}
@keyframes wave{50%{transform:skewY(-4deg) scaleX(.94)}}
.wtitle{font-family:var(--cond);font-weight:800;font-size:26px;line-height:1}
.wsub{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.4}
.ladder{display:flex;flex-direction:column;gap:4px;background:linear-gradient(#e8e2ff,#ffe6d2);border-radius:14px;padding:10px 12px}
.rung{display:grid;grid-template-columns:76px 1fr 64px;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2)}
.rung .track{position:relative;height:10px}
.rung .track::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(43,35,80,.18)}
.rung .arr{position:absolute;top:2px;height:6px;border-radius:3px;background:var(--ink)}
.rung .arr::after{content:"";position:absolute;top:-4px;border:7px solid transparent}
.rung .arr.r::after{right:-10px;border-left-color:var(--ink)}
.rung .arr.l::after{left:-10px;border-right-color:var(--ink)}
.rung .sp{font-family:var(--cond);font-weight:700;font-size:15px;color:var(--ink);text-align:right}
.callout{padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.45}
.callout.red{background:#fde6e2;color:#8c2414}
.callout.yel{background:#fff3cf;color:#6b4c00}
.callout.grn{background:#dcf3e5;color:#145c34}
.callout b{font-weight:700}
.callout .pbtn{display:block}
.pbtn.two{height:auto;padding:7px 12px;line-height:1.1;text-align:center}
.pbtn.two small{display:block;font-family:var(--body);font-weight:600;font-size:11px;opacity:.8;margin-top:2px}
.adsel{margin-top:8px;width:100%;height:36px;border-radius:10px;border:2px solid var(--line);background:#fff;font:600 13px var(--body);color:var(--ink);padding:0 6px}
.pricebox{display:flex;align-items:flex-end;justify-content:space-between}
.pricebig{font-family:var(--cond);font-weight:800;font-size:40px;line-height:.9;color:var(--coral)}
input[type=range]{width:100%;accent-color:var(--coral);height:28px}
.rivalmarks{position:relative;height:22px;margin:-6px 0 0}
.rm{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-family:var(--cond);font-weight:700;font-size:12px;color:var(--ink2)}
.rm i{width:8px;height:8px;border-radius:50%;margin-bottom:1px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--haze)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;font-size:15.5px}
.item .s{font-size:13px;color:var(--ink2);margin-top:1px;line-height:1.35}
.ic{width:38px;height:38px;flex:none}
.av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:17px;color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;margin-left:4px;vertical-align:1px}
.tag.g{background:#dcf3e5;color:#145c34}.tag.y{background:#fff3cf;color:#6b4c00}.tag.r{background:#fde6e2;color:#8c2414}.tag.n{background:#fff;color:var(--ink2)}
.sw{width:50px;height:30px;border-radius:15px;background:#d4cde2;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--green)}
.sw[aria-pressed="true"]::after{transform:translateX(20px)}

function newWeather() {

  else if (!S.firstMis) mission = null;
  return { flag, surf: Math.round(surf), layers: L, target, seed: Math.floor(Math.random() * 1e9), mission, valley: 220 + (target - 220) * rnd(.35, .6) };
}
function windAt(alt, t) {

const willing = p => 1 / (1 + Math.exp((p - 230) / 30));
