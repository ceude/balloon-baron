<title>Şafak Balon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: dawn sky canvas on top, a white "ground crew" sheet below with a big ignition button, icon tab bar at the very bottom */
:root{
  --ink:#2b2350;        /* dawn indigo: text */
  --ink2:#6c6488;       /* secondary text */
  --paper:#ffffff;
  --haze:#f1edf8;       /* row fill */
  --line:#e2dcef;
  --coral:#ff5e3a;      /* burner flame: primary */
  --coral-d:#d9411f;
  --sun:#ffc23d;
  --glass:rgba(30,24,64,.84);
  --green:#22a45d; --yellow:#e0a400; --red:#e5432f;
  --body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --cond:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:#1b1840;color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;display:block;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.n{font-family:var(--cond);font-variant-numeric:tabular-nums;font-weight:700}

/* HUD chips over the sky */
#hud{position:absolute;top:0;left:0;right:0;z-index:7;display:flex;align-items:center;gap:6px;
  padding:10px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px))}
.chip{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:rgba(255,255,255,.92);
  box-shadow:0 2px 0 rgba(43,35,80,.25);font-family:var(--cond);font-weight:700;font-size:18px;white-space:nowrap}
.chip.name{font-size:16px;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;background:rgba(43,35,80,.55);color:#fff;box-shadow:none}
.chip.name.reg{font-size:12.5px;padding:0 8px;letter-spacing:-.01em}
.chip .fl{width:10px;height:10px;border-radius:50%}
.chip.neg{color:var(--red)}
#bMenu{width:34px;padding:0;justify-content:center}
#bMenu svg{width:18px;height:18px}

/* home: world full screen, glass widgets on top */
#sheet{position:absolute;inset:0;z-index:5;pointer-events:none}
#sheet > *{pointer-events:auto}
.wxw{position:absolute;left:max(12px, env(safe-area-inset-left, 0px));width:204px;padding:10px 12px;border-radius:18px;background:var(--glass);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.wxh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.flagmini{width:14px;height:22px;border-radius:2px 5px 5px 2px;box-shadow:-3px 0 0 #fff;margin-left:3px}
.wxt{font-family:var(--cond);font-weight:800;font-size:19px;line-height:1}
.wxs{font-size:12px;opacity:.75}
.lr{display:grid;grid-template-columns:60px 1fr 22px;gap:6px;align-items:center;font-size:11px}
.lr span:first-child{opacity:.7}
.lr b{font-family:var(--cond);font-size:14px;text-align:right}
.lt{position:relative;height:8px}
.lt::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.3)}
.lt i{position:absolute;top:2px;height:4px;border-radius:2px;background:var(--sun)}
.lt i::after{content:"";position:absolute;top:-4px;border:6px solid transparent}
.lt i.r::after{right:-8px;border-left-color:var(--sun)}
.lt i.l::after{left:-8px;border-right-color:var(--sun)}
.side{position:absolute;right:max(10px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:10px}
.side button{width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:11.5px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6);position:relative}
.side .ib{width:50px;height:50px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 rgba(43,35,80,.4)}
.side button:active .ib{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,35,80,.4)}
.side svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.side .dot{position:absolute;top:-3px;right:0;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid #fff}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px, env(safe-area-inset-bottom, 0px));width:min(560px,calc(100% - 16px));
  padding:12px;border-radius:24px;background:var(--glass);color:#fff;display:flex;flex-direction:column;gap:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(10,5,30,.4)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alerts:empty{display:none}
.alert{font-size:13px;line-height:1.35;padding:7px 10px;border-radius:10px;text-align:left;color:#fff}
.alert.red{background:rgba(229,67,47,.92)}
.alert.yel{background:rgba(255,194,61,.95);color:#2b1d00}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:5px}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 6px;border-radius:16px;min-width:156px;text-align:left;background:rgba(255,255,255,.1);box-shadow:0 4px 0 rgba(0,0,0,.28);color:#fff;position:relative}
.fchip .ic{width:32px;height:32px}
.fchip .fc{display:flex;flex-direction:column;line-height:1.25;font-size:11.5px}
.fchip .fc b{font-size:14.5px}
.fchip .fc span{opacity:.85}
.fchip .fstate{position:absolute;top:7px;right:9px;font-family:var(--cond);font-weight:800;font-size:11px;letter-spacing:.04em;opacity:.8}
.fchip.on{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--coral)}
.fchip.on .fstate{color:var(--coral);opacity:1}
.fchip.off .ic{filter:grayscale(.85);opacity:.55}
.fchip.blocked{background:rgba(255,255,255,.05);box-shadow:none;opacity:.8}
.fchip:active{transform:translateY(3px)}
.fsum{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 6px;border-radius:16px;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--coral);text-align:left}
.fsum.warn{box-shadow:0 4px 0 var(--sun)}
.fsum .ic{width:32px;height:32px;flex:none}
.fsum .fc{flex:1;display:flex;flex-direction:column;line-height:1.3;font-size:12px;min-width:0}
.fsum .fc b{font-size:15px}
.fsum .fc span{color:var(--ink2)}
.fsum .fgo{font-family:var(--cond);font-weight:800;font-size:15px;color:var(--coral);flex:none}
.fsum:active{transform:translateY(3px)}
.fplan{gap:8px}
.fplan .btns{margin-bottom:4px}
.fgh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--ink2)}
.fgh b{color:var(--ink)}
.fgb{display:flex;gap:6px;flex:none}
.fgb button{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:9px;background:var(--haze);color:var(--ink)}
.frow{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:14px;background:var(--haze)}
.frow .ic{width:28px;height:28px;flex:none}
.frow .main{flex:1;min-width:0}
.frow .t{font-weight:700;font-size:14.5px}
.frow .s{font-size:12.5px;color:var(--ink2)}
.frow.off .ic{filter:grayscale(.85);opacity:.55}
.flybtn{flex:none;min-width:84px;height:36px;padding:0 12px;border-radius:12px;font-family:var(--cond);font-weight:800;font-size:15px;letter-spacing:.04em;background:#e4deef;color:var(--ink2);box-shadow:0 3px 0 #c9c1db}
.flybtn.on{background:var(--coral);color:#fff;box-shadow:0 3px 0 #c7381a}
.whofly{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:16px;background:#fff3e8;font-size:13px;color:var(--ink2)}
.whofly b{color:var(--ink);font-size:15px}
.whob{display:flex;gap:8px;margin-top:4px}
.whob .flybtn{flex:1}
.flybtn:active{transform:translateY(3px);box-shadow:none}
.frow.blocked{opacity:.7}
.rd{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 3px 0 5px}
.rd.g{background:#3ad07a}.rd.y{background:var(--sun)}.rd.r{background:#ff6b55}
.ochip{flex:none;display:flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 6px;border-radius:12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.1);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.ochip .ck{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.15);font-weight:800}
.ochip.on{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--green)}
.ochip.on .ck{background:var(--green);color:#fff}
.ochip:active{transform:translateY(2px)}
.pricer{display:flex;align-items:center;gap:10px}
.rb{width:52px;height:52px;border-radius:16px;background:#fff;color:var(--ink);font-family:var(--cond);font-weight:800;font-size:30px;line-height:1;box-shadow:0 4px 0 rgba(0,0,0,.3);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.pmid{flex:1;text-align:center}
.pl{font-size:12px;opacity:.75}
.pmid .pricebig{color:var(--sun);font-size:38px}
.prv{display:flex;justify-content:center;gap:10px;font-family:var(--cond);font-weight:700;font-size:13px;opacity:.85;margin-top:3px}
.prv i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.dock .est,.psh .est{color:rgba(255,255,255,.8)}
.dock .est b,.psh .est b{color:#fff}
.pcard{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.1);color:#fff;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.pcard:active{transform:translateY(3px)}
.pcard .pp{display:flex;flex-direction:column;line-height:1.05}
.pcard .pp small{font-size:11px;opacity:.7}
.pcard .pp b{font-family:var(--cond);font-weight:800;font-size:28px;color:var(--sun)}
.pcard .pf{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;opacity:.9}
.pcard .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.pcard .bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.pcard .pgo{font-family:var(--cond);font-weight:800;font-size:15px;color:var(--sun)}
#psheet{position:absolute;inset:0;z-index:7;background:rgba(20,15,45,.45);display:flex;align-items:flex-end;justify-content:center}
.psh{width:min(560px,calc(100% - 16px));margin-bottom:max(10px, env(safe-area-inset-bottom, 0px));padding:16px;border-radius:24px;background:var(--glass);color:#fff;display:flex;flex-direction:column;gap:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:pgin .2s ease-out}
.pshh{display:flex;align-items:center;justify-content:space-between;font-family:var(--cond);font-size:22px}
.psh .pclose{background:rgba(255,255,255,.15);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:rgba(255,255,255,.08);border-radius:14px;padding:8px 6px;text-align:center}
.tile b{display:block;font-family:var(--cond);font-weight:800;font-size:24px;line-height:1.05}
.tile span{font-size:11.5px;opacity:.75}
.feel{display:flex;flex-direction:column;gap:6px}
.fl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;opacity:.9}
.fl.sm{font-size:11px;opacity:.6;margin-top:-2px}
.fl b{font-family:var(--cond);font-size:20px}
.fl b.g{color:#5ee08f}.fl b.y{color:var(--sun)}.fl b.o{color:#ff9a4d}.fl b.r{color:#ff6b55}
.meter{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#3ad07a 0%,#3ad07a 18%,#ffc23d 32%,#ffc23d 43%,#ff8a3d 57%,#ff8a3d 68%,#ff5540 82%)}
.meter i{position:absolute;top:-4px;width:6px;height:18px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5);transition:left .15s}
.mood{margin:2px 0 0;font-size:13px;line-height:1.4;opacity:.85;text-align:left}
.mood b{font-family:var(--cond);font-size:15px}
.res{display:flex;justify-content:space-between;align-items:flex-end;width:100%}
.res div{display:flex;flex-direction:column}
.res .rr{text-align:right;align-items:flex-end}
.psh .res b{font-family:var(--cond);font-weight:800;font-size:30px;color:#fff;line-height:1}
.res span{font-size:12px;opacity:.75}
.res em{font-style:normal;font-weight:700}
.res em.up{color:#5ee08f}.res em.dn{color:#ff6b55}
.psh .est{flex-direction:column;gap:8px}
.bar.big{height:9px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;width:100%}
.bar.big i{display:block;height:100%;background:var(--green)}
.alert.more{background:rgba(255,255,255,.1);font-weight:700;text-align:center}
.dock .ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3)}
#page{position:absolute;inset:0;z-index:6;background:#f6f3fb;display:flex;flex-direction:column;animation:pgin .22s ease-out}
@keyframes pgin{from{transform:translateY(24px);opacity:.4}}
.phead{display:flex;align-items:center;justify-content:space-between;padding:12px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px))}
.phead h1{margin:0;font-family:var(--cond);font-weight:800;font-size:34px}
.pclose{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--line);font-size:20px;font-weight:700}
#tabBody{flex:1;overflow-y:auto;padding:8px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:20px}
#page .item{background:#fff;box-shadow:0 2px 0 var(--line)}
/* the home screen's town, zoomed in: same picture, the rest of the screen fades away */
#town{position:absolute;inset:0;z-index:8;background:#3a2a4a;opacity:0;transition:opacity .25s ease}
#town.on{opacity:1}
#town canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#tClose{position:absolute;top:max(14px, env(safe-area-inset-top, 0px));right:max(14px, env(safe-area-inset-right, 0px));width:46px;height:46px;border-radius:50%;background:rgba(255,250,243,.95);color:var(--ink);font-size:20px;font-weight:800;box-shadow:0 4px 0 rgba(43,35,80,.35);display:grid;place-items:center;transition:opacity .2s ease, transform .2s ease}
#tClose.gone{opacity:0;transform:scale(.6);pointer-events:none}
.sw8{width:66px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:13px;flex:none}
.sw8.none{background:var(--haze);color:var(--ink2)}
.adbtn{margin-top:8px;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;background:var(--haze);box-shadow:0 2px 0 var(--line);font-size:13px;font-weight:600}
.adbtn i{width:10px;height:10px;border-radius:3px}
.act{padding:10px 16px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.est{font-size:13.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.est b{color:var(--ink);font-family:var(--cond);font-size:17px}
.btns{display:flex;gap:10px}
.big{flex:1;height:54px;border-radius:16px;background:var(--coral);color:#fff;font-family:var(--cond);font-weight:800;font-size:22px;letter-spacing:.01em;
  box-shadow:0 5px 0 var(--coral-d);transition:transform .06s, box-shadow .06s}
.big:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--coral-d)}
.big:disabled{background:#cfc8dd;box-shadow:0 5px 0 #b3aac6;cursor:not-allowed}
.ghost{height:54px;padding:0 16px;border-radius:16px;background:var(--haze);font-family:var(--cond);font-weight:700;font-size:18px;box-shadow:0 5px 0 var(--line)}
.ghost:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
nav{display:flex;border-top:1px solid var(--line);padding:4px max(8px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:11.5px;font-weight:600;color:var(--ink2);position:relative;border-radius:12px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--coral)}
nav button .dot{position:absolute;top:4px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* content blocks */
h2{margin:0;font-family:var(--cond);font-weight:700;font-size:22px;line-height:1.1}
.sec{display:flex;flex-direction:column;gap:10px}
.hint{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.weather{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.flagbig{width:58px;height:64px;position:relative}
.flagbig i{position:absolute;left:4px;top:0;width:4px;height:64px;border-radius:2px;background:var(--ink)}
.flagbig b{position:absolute;left:8px;top:3px;width:46px;height:30px;border-radius:0 6px 6px 0;animation:wave 2.2s ease-in-out infinite;transform-origin:left center}
@keyframes wave{50%{transform:skewY(-4deg) scaleX(.94)}}
.wtitle{font-family:var(--cond);font-weight:800;font-size:26px;line-height:1}
.wsub{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.4}
.ladder{display:flex;flex-direction:column;gap:4px;background:linear-gradient(#e8e2ff,#ffe6d2);border-radius:14px;padding:10px 12px}
.rung{display:grid;grid-template-columns:76px 1fr 64px;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2)}
.rung .track{position:relative;height:10px}
.rung .track::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(43,35,80,.18)}
.rung .arr{position:absolute;top:2px;height:6px;border-radius:3px;background:var(--ink)}
.rung .arr::after{content:"";position:absolute;top:-4px;border:7px solid transparent}
.rung .arr.r::after{right:-10px;border-left-color:var(--ink)}
.rung .arr.l::after{left:-10px;border-right-color:var(--ink)}
.rung .sp{font-family:var(--cond);font-weight:700;font-size:15px;color:var(--ink);text-align:right}
.callout{padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.45}
.callout.red{background:#fde6e2;color:#8c2414}
.callout.yel{background:#fff3cf;color:#6b4c00}
.callout.grn{background:#dcf3e5;color:#145c34}
.callout b{font-weight:700}
.callout .pbtn{display:block}
.pbtn.two{height:auto;padding:7px 12px;line-height:1.1;text-align:center}
.pbtn.two small{display:block;font-family:var(--body);font-weight:600;font-size:11px;opacity:.8;margin-top:2px}
.adsel{margin-top:8px;width:100%;height:36px;border-radius:10px;border:2px solid var(--line);background:#fff;font:600 13px var(--body);color:var(--ink);padding:0 6px}
.pricebox{display:flex;align-items:flex-end;justify-content:space-between}
.pricebig{font-family:var(--cond);font-weight:800;font-size:40px;line-height:.9;color:var(--coral)}
input[type=range]{width:100%;accent-color:var(--coral);height:28px}
.rivalmarks{position:relative;height:22px;margin:-6px 0 0}
.rm{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-family:var(--cond);font-weight:700;font-size:12px;color:var(--ink2)}
.rm i{width:8px;height:8px;border-radius:50%;margin-bottom:1px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--haze)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;font-size:15.5px}
.item .s{font-size:13px;color:var(--ink2);margin-top:1px;line-height:1.35}
.ic{width:38px;height:38px;flex:none}
.av{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:17px;color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;margin-left:4px;vertical-align:1px}
.tag.g{background:#dcf3e5;color:#145c34}.tag.y{background:#fff3cf;color:#6b4c00}.tag.r{background:#fde6e2;color:#8c2414}.tag.n{background:#fff;color:var(--ink2)}
.sw{width:50px;height:30px;border-radius:15px;background:#d4cde2;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--green)}
.sw[aria-pressed="true"]::after{transform:translateX(20px)}
.pbtn{height:38px;padding:0 14px;border-radius:12px;background:var(--ink);color:#fff;font-family:var(--cond);font-weight:700;font-size:16px;white-space:nowrap;box-shadow:0 3px 0 #17122f}
.pbtn.light{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.pbtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #17122f}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.sharebar{display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--haze)}
.sharebar span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{font-family:var(--cond)}
.rv .t{display:flex;align-items:center;gap:6px}
.merge{border-top:6px solid var(--red)}
.merge .mico{display:flex;align-items:center;gap:6px;font-family:var(--cond);font-weight:800;font-size:28px;color:var(--ink2)}
.merge .mico .ic{width:56px;height:56px}
.merge .mtag{align-self:flex-start;font-family:var(--cond);font-weight:800;letter-spacing:.08em;font-size:13px;color:#fff;background:var(--red);padding:3px 9px;border-radius:8px}
.merge .stats{grid-template-columns:repeat(3,1fr)}
.merge .stats div{background:var(--haze)}
.side .gbadge{position:absolute;top:34px;right:-6px;min-width:26px;height:18px;padding:0 5px;border-radius:9px;background:var(--coral);color:#fff;font-family:var(--cond);font-weight:800;font-size:12px;line-height:18px;border:2px solid #fff;text-shadow:none}
.goals .chap{font-family:var(--cond);font-weight:800;font-size:14px;letter-spacing:.06em;color:var(--coral);text-transform:uppercase}
.goal{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--haze)}
.goal .gk{width:28px;height:28px;flex:none;border-radius:9px;border:2px solid #cfc6e0;display:grid;place-items:center;font-weight:800;color:#fff}
.goal.done .gk{background:var(--green);border-color:var(--green)}
.goal .gm{flex:1;min-width:0}
.goal .gt{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.goal .gt span{font-family:var(--cond);font-weight:700;color:var(--ink2);white-space:nowrap}
.goal .gb{height:7px;border-radius:4px;background:#e2dcef;margin-top:6px;overflow:hidden}
.goal .gb i{display:block;height:100%;background:var(--coral);border-radius:4px}
.goal.done .gb i{background:var(--green)}
.chapdone{border-top:6px solid var(--sun)}
.baron{border-top:6px solid var(--sun);background:linear-gradient(#fff8e1,var(--paper) 40%)}
.crown{width:84px;height:63px;align-self:center}
.world{gap:12px}
.hbox{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;background:linear-gradient(135deg,#231c48,#3d2f6e);color:#fff;box-shadow:0 0 0 1px rgba(255,194,61,.35) inset}
.cf3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cf3 div{background:rgba(255,255,255,.07);border-radius:12px;padding:7px 8px}
.cf3 span{display:block;font-size:11.5px;opacity:.7}
.cf3 b{font-family:var(--cond);font-weight:800;font-size:19px}
.cf3 .g b{color:#5ee08f}.cf3 .r b{color:#ff8a78}.cf3 .n b{color:var(--sun)}
.cfcap{font-size:11.5px;opacity:.7;line-height:1.4}
.cfcap .lg{display:inline-block;width:9px;height:9px;border-radius:3px;margin:0 3px 0 4px;vertical-align:-1px}
.cfcap .lg.g{background:#3ad07a}.cfcap .lg.r{background:#ff6b55}
.cfchart{width:100%;height:auto;display:block}
.cfchart .cfd:hover rect[fill="transparent"]{fill:rgba(255,255,255,.08)}
.cfempty{font-size:12.5px;opacity:.7;padding:18px 0;text-align:center}
#page.lux{background:linear-gradient(#17122f,#221a45 40%,#17122f);color:#f4efff}
#page.lux .phead h1{color:var(--sun)}
#page.lux h2{color:#ffe08a}
#page.lux .hint{color:rgba(244,239,255,.65)}
#page.lux .item{background:rgba(255,255,255,.07);box-shadow:none;color:#f4efff}
#page.lux .item .s{color:rgba(244,239,255,.7)}
#page.lux .ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.35)}
#page.lux .pbtn.light{background:rgba(255,255,255,.12);color:#fff}
#page.lux .pclose{background:rgba(255,255,255,.12);color:#fff}
.deal{display:grid;grid-template-columns:64px 1fr;gap:10px 12px;padding:14px;border-radius:20px;background:linear-gradient(135deg,#2e2460,#1d1740);box-shadow:0 0 0 1px rgba(255,194,61,.28) inset,0 6px 18px rgba(0,0,0,.35)}
.deal.on{box-shadow:0 0 0 2px #3ad07a inset,0 6px 18px rgba(0,0,0,.35)}
.deal .dart{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.06);display:grid;place-items:center}
.deal .dart svg{width:48px;height:48px}
.deal .dk{font-family:var(--cond);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--sun)}
.deal .dt{font-family:var(--cond);font-weight:800;font-size:21px;line-height:1.1;color:#fff}
.deal .dd{font-size:13px;color:rgba(244,239,255,.72);margin-top:3px;line-height:1.35}
.deal .dchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.deal .dchips span{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:rgba(58,208,122,.16);color:#7ff0ae}
.deal .dfoot{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed rgba(255,255,255,.15);padding-top:10px}
.deal .dprice{font-family:var(--cond);font-weight:800;font-size:24px;color:var(--sun);margin-right:auto}
.dcta{padding:10px 16px;border-radius:13px;background:linear-gradient(#ffd25e,#ffb21d);color:#2b1d00;font-family:var(--cond);font-weight:800;font-size:16px;box-shadow:0 3px 0 #b07800}
.dcta:disabled{opacity:.45}
.dcta:active{transform:translateY(3px);box-shadow:none}
.deal .dstat{font-weight:800;color:#7ff0ae;font-size:14px}
.deal .dnote{width:100%;font-size:12px;color:rgba(244,239,255,.6)}
.offices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.office{display:flex;flex-direction:column;gap:5px;padding:12px;border-radius:18px;background:linear-gradient(160deg,#2e2460,#1d1740);box-shadow:0 0 0 1px rgba(255,194,61,.25) inset}
.office.on{box-shadow:0 0 0 2px var(--sun) inset}
.office .oi{font-size:30px;line-height:1}
.office .onm{font-family:var(--cond);font-weight:800;font-size:19px;color:#fff}
.office .op{font-size:12px;color:rgba(244,239,255,.7);line-height:1.35;flex:1}
.office .ostat{font-family:var(--cond);font-weight:800;color:var(--sun);font-size:15px}
.office .dcta{font-size:14px;padding:8px 10px}
.hbox .hk{display:flex;flex-direction:column}
.hbox .hk span{font-size:13px;opacity:.75}
.hbox .hk b{font-family:var(--cond);font-weight:800;font-size:36px;color:var(--sun);line-height:1.05}
.hbox .hf{display:flex;flex-direction:column;gap:3px;font-size:13px;opacity:.9}
.issue{border-top:6px solid var(--red)}
.issue .chap{color:var(--red)}
.hzline{display:flex;gap:10px;align-items:center;font-size:13.5px;line-height:1.4;color:var(--ink2);background:var(--haze);border-radius:14px;padding:8px 10px}
.hzline .hzav{width:40px;height:40px;flex:none}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border-radius:16px;background:#fff;box-shadow:0 0 0 2px var(--line) inset,0 3px 0 var(--line)}
.opt.a{box-shadow:0 0 0 2px var(--coral) inset,0 3px 0 #c7381a}
.opt b{font-size:15.5px;color:var(--ink)}.opt span{font-size:13px;color:var(--ink2)}
.opt:disabled{opacity:.5}
.studio{gap:10px}
.studio .pv{display:flex;gap:14px;align-items:center;background:linear-gradient(#6aa5d8,#f6c08a);border-radius:18px;padding:8px 14px}
.studio .pv img{width:150px;height:190px}
.studio .sc{flex:1;display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.85);border-radius:14px;padding:10px;font-size:12px;color:var(--ink2)}
.studio .sc b{font-family:var(--cond);font-size:36px;color:var(--ink);line-height:1}
.studio .sc .gb{height:7px;border-radius:4px;background:#e2dcef;overflow:hidden}.studio .sc .gb i{display:block;height:100%;background:var(--coral)}
.studio .lbl{font-weight:700;font-size:13px;color:var(--ink2);margin-top:2px}
.pats{display:flex;flex-wrap:wrap;gap:6px}
.pat{padding:7px 11px;border-radius:11px;background:var(--haze);font-weight:700;font-size:13px;color:var(--ink)}
.pat.on{background:var(--coral);color:#fff;box-shadow:0 3px 0 #c7381a}
.sws{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.sw2{aspect-ratio:1;border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.15) inset}
.sw2.on{box-shadow:0 0 0 3px var(--ink);transform:scale(1.08)}
.studio .nm{box-sizing:border-box;width:100%;padding:11px 12px;border-radius:12px;border:2px solid var(--line);font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.dthumb{width:38px;height:48px;flex:none}
.wmap{position:relative;aspect-ratio:100/42.3;border-radius:16px;background:linear-gradient(#2a2156,#3d3070);overflow:hidden}
.wmap .wbg{position:absolute;inset:0;width:100%;height:100%}
.wpin{position:absolute;width:0;height:0}
.wpin .pd{position:absolute;left:-6px;top:-6px;width:12px!important;height:12px!important}
.wpin .pl{position:absolute}
.wpin.sr .pl{left:9px;top:-8px;text-align:left}
.wpin.sl .pl{right:9px;top:-8px;text-align:right}
.wpin.sb .pl{top:8px;left:-40px;width:80px}
.wpin.st .pl{bottom:8px;left:-40px;width:80px;display:flex;flex-direction:column-reverse}
.wpin .pd{width:14px;height:14px;border-radius:50%;background:#9a8fb8;border:2px solid #fff}
.wpin.own .pd{background:var(--sun);box-shadow:0 0 0 5px rgba(255,194,61,.35)}
.wpin.open .pd{background:var(--coral);box-shadow:0 0 0 5px rgba(255,94,58,.35);animation:pulse 1.4s infinite}
.wpin .pl{font-size:10px;color:rgba(255,255,255,.75);text-align:center;line-height:1.15;white-space:nowrap}
.wpin .pl b{display:block;font-family:var(--cond);font-size:13px;color:#fff}
.wpin.soon{opacity:.6}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,94,58,.1)}}
.wlist{display:flex;flex-direction:column;gap:8px}
.wlist .item.lock{opacity:.65}
#page .item.rv.me{background:#fff3e8;box-shadow:0 0 0 2px var(--coral) inset, 0 2px 0 var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.stats div{background:#fff;border-radius:10px;padding:5px 6px;text-align:center;font-size:11px;color:var(--ink2)}
.stats b{display:block;font-family:var(--cond);font-size:17px;color:var(--ink)}

/* modals */
.modal{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(27,24,64,.55);
  padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px))}
.card{box-sizing:border-box;width:min(420px,100%);max-height:100%;overflow-y:auto;background:var(--paper);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card h1{margin:0;font-family:var(--cond);font-weight:800;font-size:32px;line-height:1}
/* flight log ticket */
.ticket{width:min(420px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;filter:drop-shadow(0 20px 40px rgba(0,0,0,.35))}
.stub{background:var(--ink);color:#fff;border-radius:22px 22px 0 0;padding:18px 20px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.stub .d{font-family:var(--cond);font-weight:800;font-size:34px;line-height:.9}
.stub .m{font-size:13px;opacity:.75;margin-top:4px}
.perf{height:18px;background:radial-gradient(circle at 0 50%, transparent 9px, #fff 9.5px) left/51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 9px, #fff 9.5px) right/51% 100% no-repeat;position:relative}
.perf::after{content:"";position:absolute;left:16px;right:16px;top:50%;border-top:2px dashed var(--line)}
.tbody{background:#fff;border-radius:0 0 22px 22px;padding:6px 20px 20px;display:flex;flex-direction:column;gap:14px}
.led{display:flex;flex-direction:column;gap:5px;font-size:14.5px}
.led div{display:flex;justify-content:space-between;gap:10px}
.led .v{font-family:var(--cond);font-weight:700;font-size:17px}
.led .tot{border-top:2px solid var(--ink);padding-top:8px;margin-top:4px;font-weight:700}
.led .tot .v{font-size:22px}
.pos{color:var(--green)} .neg{color:var(--red)}
.ev{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.4}
.ev li{display:flex;gap:10px}
.ev li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--coral)}
.ev li.r{color:var(--ink2)}
.ev li.r::before{background:#c3bbd6}
.palette{display:flex;gap:12px}
.palette button{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--haze);border:3px solid transparent}
.palette button[aria-pressed="true"]{border-color:var(--ink)}
.field{box-sizing:border-box;height:50px;border-radius:14px;border:2px solid var(--line);padding:0 14px;font:600 18px var(--body);color:var(--ink);background:#fff;width:100%;min-width:0}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{padding:6px 10px;border-radius:10px;background:var(--haze);font-size:13.5px;font-weight:600}
textarea{box-sizing:border-box;background:#fff;width:100%;font:13px var(--body);border:2px solid var(--line);border-radius:12px;padding:10px;resize:vertical;color:var(--ink)}

/* flight */
#tip{position:absolute;left:max(16px, env(safe-area-inset-left, 0px));bottom:max(20px, env(safe-area-inset-bottom, 0px));z-index:4;
  width:min(420px,calc(100% - 140px));text-align:left;font-size:14.5px;line-height:1.45;padding:12px 16px;border-radius:18px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#tip.wide{width:min(420px,calc(100% - 32px));left:50%;transform:translateX(-50%)}
#burn{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:max(22px, env(safe-area-inset-bottom, 0px));z-index:4;
  width:96px;height:96px;border-radius:50%;background:var(--coral);color:#fff;font-family:var(--cond);font-weight:800;font-size:18px;
  box-shadow:0 7px 0 var(--coral-d),0 10px 24px rgba(0,0,0,.3);touch-action:none;-webkit-user-select:none;user-select:none}
#burn.on{transform:translateY(5px);box-shadow:0 2px 0 var(--coral-d),0 0 0 8px rgba(255,194,61,.45)}
#abort{position:absolute;left:max(16px, env(safe-area-inset-left, 0px));bottom:max(22px, env(safe-area-inset-bottom, 0px));z-index:4;height:54px;padding:0 18px;border-radius:16px;
  background:#fff;color:var(--ink);font-family:var(--cond);font-weight:700;font-size:18px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
#abort:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
#abort:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}
#tip.up{bottom:max(96px, calc(env(safe-area-inset-bottom, 0px) + 86px))}
.dem{font-size:13px;line-height:1.35;color:rgba(255,255,255,.8);text-align:center}
.dem b{color:#fff;font-family:var(--cond);font-size:16px}
#hCash,#hRep{cursor:pointer}
.chart{width:100%;height:auto;display:block}
#collect{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px, env(safe-area-inset-bottom, 0px));z-index:6;width:min(560px,calc(100% - 16px));
  padding:16px;border-radius:24px;background:var(--glass);color:#fff;display:flex;flex-direction:column;gap:12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(10,5,30,.4)}
.ctitle{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ctitle h2{color:#fff}
#collect .ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.ctitle .hint{color:rgba(255,255,255,.7)}
.ccount{font-family:var(--cond);font-weight:800;font-size:42px;line-height:.9;color:var(--sun);white-space:nowrap}
.ctime{height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.ctime i{display:block;height:100%;background:var(--sun);width:100%}
.seats{display:flex;flex-wrap:wrap;gap:4px;max-height:180px;overflow:hidden}
.seat{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.12);transition:background .2s, transform .2s}
.seats.sm .seat{width:10px;height:10px;border-radius:3px}
.seat.f{transform:scale(1.12)}
.srcs{display:flex;flex-direction:column;gap:6px;font-size:14px}
.src{display:flex;align-items:center;gap:8px}
.src i{width:12px;height:12px;border-radius:4px;flex:none}
.src b{margin-left:auto;font-family:var(--cond);font-size:18px}
.alert.win{background:rgba(190,220,255,.22);border:1px solid rgba(200,230,255,.7)}
.alert.mis{background:rgba(58,208,192,.18);border:1px solid rgba(58,208,192,.6)}
.alert.grn{background:rgba(34,164,93,.22);border:1px solid rgba(80,210,140,.65)}
.condbar{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--ink2)}
.condbar .ct{flex:1;height:6px;border-radius:3px;background:var(--haze);overflow:hidden}
.condbar .ct i{display:block;height:100%}
#hez{position:absolute;left:50%;transform:translateX(-50%);top:max(60px, calc(env(safe-area-inset-top, 0px) + 52px));z-index:8;width:min(460px,calc(100% - 20px));
  display:flex;gap:6px;align-items:flex-end;animation:hzin .35s cubic-bezier(.2,.9,.3,1.2)}
#hez::before{content:"";position:absolute;left:-100vw;right:-100vw;top:-100vh;bottom:-200vh;background:rgba(20,14,40,.5);z-index:-1}
@keyframes hzin{from{transform:translate(-50%,-16px) scale(.96);opacity:0}}
.hzcol{flex:none;display:flex;flex-direction:column;align-items:center;gap:0;position:relative;z-index:1}
.hzav{width:84px;height:84px;filter:drop-shadow(0 8px 16px rgba(15,8,35,.5))}
.hzname{margin-top:-10px;font-family:var(--cond);font-weight:800;font-size:13px;letter-spacing:.02em;color:#ffd27a;background:var(--ink);padding:3px 9px;border-radius:8px;border:1.5px solid #e8b04a;white-space:nowrap}
.hzb{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;margin-bottom:22px;background:#fff;border-radius:20px 20px 20px 6px;padding:13px 15px 12px;box-shadow:0 14px 36px rgba(15,8,35,.45)}
.hzb::before{content:"";position:absolute;left:-10px;bottom:10px;border-style:solid;border-width:8px 12px 8px 0;border-color:transparent #fff transparent transparent}
.hzb p{margin:0;font-size:15px;line-height:1.45;color:var(--ink);min-height:2.9em}
.hzb .pbtn{align-self:flex-end}
.chirp{position:absolute;left:50%;transform:translateX(-50%);z-index:4;width:min(440px,calc(100% - 24px));display:flex;gap:10px;align-items:flex-start;
  padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 4px 14px rgba(20,10,40,.25);transition:opacity .35s, transform .35s}
.chirp.out{opacity:0;transform:translate(-50%,-8px);pointer-events:none}
.chirp .av,.rev .av{width:34px;height:34px;font-size:15px}

function windAt(alt, t) {

/* ---------- market ---------- */
const willing = p => 1 / (1 + Math.exp((p - 230) / 30));
function allocate(comps, T) {
  const w = comps.map(c => willing(c.price));

  const pax = comps.map((c, i) => Math.min(c.cap, Math.floor(want[i] * w[i])));
  let pool = comps.reduce((a, c, i) => a + Math.max(0, want[i] * w[i] - c.cap) + want[i] * (1 - w[i]) * .5, 0);
  for (let pass = 0; pass < 3 && pool >= 1; pass++) {
    const sp = comps.map((c, i) => c.cap - pax[i] > 0 ? att[i] : 0), s2 = sp.reduce((a, b) => a + b, 0);
    if (!s2) break; let next = 0;
    comps.forEach((c, i) => {
      if (!sp[i]) return;
      const offered = pool * sp[i] / s2, take = Math.min(c.cap - pax[i], Math.floor(offered * w[i]));
      pax[i] += take; next += Math.max(0, offered * w[i] - take);
    });
    pool = next;
  }
  return pax;
}

function market(myPrice, myCap) {

  comps[0].cap = room;

  for (const x of pop) { const n = Math.min(room, x.n); if (n > 0) { parts.push(Object.assign({}, x, { n })); room -= n; } }

function holdBoost(id) {

/* ---------- isometric drawing ---------- */
/* Light comes from the left: faces toward +gy (screen left) are lit, faces toward +gx are in shade,
   and every object casts a soft shadow to the right on the ground. */
const TUFF = { lit: '#f1d6b0', shade: '#b9825c', top: '#f8e4c4', line: 'rgba(110,60,30,.16)' };
const SUN_SH = [0.55, 0.2]; /* screen offset of a shadow per world px of height */
function tpoly(pts, fill, stroke, lw = 1.5) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
const lp = (p, q, k) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k)];
const upp = (p, h) => [p[0], p[1] - h];
/* Draw on a face: unit square mapped onto the parallelogram p→q (bottom edge) raised by h. */
function tface(p, q, h, fn) { ctx.save(); ctx.transform(q[0] - p[0], q[1] - p[1], 0, -h, p[0], p[1]); fn(); ctx.restore(); }
/* A textured stone wall: base colour, stone courses, specks and darkening near the ground. */
function stoneWall(p, q, h, col, seed, courses = true) {
  const poly = [p, q, upp(q, h), upp(p, h)];
  tpoly(poly, col);
  ctx.save(); ctx.beginPath(); poly.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.clip();
  const R = mulberry32(seed), len = Math.hypot(q[0] - p[0], q[1] - p[1]);
  if (courses) {
    ctx.strokeStyle = TUFF.line; ctx.lineWidth = 1;
    for (let y = 14, row = 0; y < h; y += 14, row++) {
      ctx.beginPath(); ctx.moveTo(p[0], p[1] - y); ctx.lineTo(q[0], q[1] - y); ctx.stroke();
      for (let u = (row % 2) * .5 / Math.max(1, len / 26); u < 1; u += 26 / len) { const a = lp(p, q, u); ctx.beginPath(); ctx.moveTo(a[0], a[1] - y); ctx.lineTo(a[0], a[1] - y + 14); ctx.stroke(); }
    }
  }
  for (let i = 0; i < len * h / 260; i++) { const a = lp(p, q, R()), y = R() * h; ctx.fillStyle = R() < .5 ? 'rgba(255,245,225,.18)' : 'rgba(90,45,20,.12)'; ctx.fillRect(a[0], a[1] - y, 2 + R() * 3, 2); }
  const g = ctx.createLinearGradient(0, Math.min(p[1], q[1]) - h, 0, Math.max(p[1], q[1]));
  g.addColorStop(0, 'rgba(255,240,215,.10)'); g.addColorStop(.75, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(70,30,15,.28)');
  ctx.fillStyle = g; ctx.fillRect(Math.min(p[0], q[0]) - 2, Math.min(p[1], q[1]) - h - 2, Math.abs(q[0] - p[0]) + 4, h + Math.abs(q[1] - p[1]) + 4);
  ctx.restore();
}
function corners(gx, gy, w, d) { return { A: tiso(gx, gy), B: tiso(gx + w, gy), C: tiso(gx + w, gy + d), D: tiso(gx, gy + d) }; }
/* A stone block: lit left wall, shaded right wall, top. */
function block(gx, gy, w, d, h, o = {}) {
  const { A, B, C, D } = corners(gx, gy, w, d), seed = o.seed || Math.round(gx * 31 + gy * 17);
  stoneWall(D, C, h, o.lit || TUFF.lit, seed, o.courses !== false);

function drawHomeTown(w, dockTop, top) {
  /* the town sits on the dock; its back corner stays below the weather card so the card covers only valley */
  const wx = $('wx'), wxb = wx && !wx.hidden && wx.offsetHeight ? wx.offsetTop + wx.offsetHeight : top;
  const back = Math.max(top + 20, wxb - 16), front = dockTop - 6;
  HOME.h = dockTop; HOME.z = clamp((front - back) / 1024, .15, w / 1500);
  const [cx] = tiso(7, 8); HOME.ox = w / 2 - cx * HOME.z; HOME.oy = front - tiso(15.5, 15.5)[1] * HOME.z;
  renderTown(HOME, w, dockTop, DPR, 0);
}
function homeTap(x, y) {
  if (y > HOME.h) return;
  const zh = HOME.zoneHits.find(hh => inPoly([x, y], hh.pts));
  if (zh) { sfx('click'); openTown(zh.zn.at); return; }
  const hit = HOME.hits.slice().sort((a, b) => b.depth - a.depth).find(hh => inPoly([x, y], hh.pts) || (x > hh.box[0] && x < hh.box[2] && y > hh.box[1] && y < hh.box[3]));
  sfx('click');
  if (hit) hit.b.tap(); else openTown(homeGrid(x, y));
}
/* The grid point under a tap on the home town, kept inside the walls. */
function homeGrid(x, y) {
  const wx = (x - HOME.ox) / HOME.z, wy = (y - HOME.oy) / HOME.z, a = wx / (TW / 2), b = wy / (TH / 2);
  return [clamp((a + b) / 2, 0, 15), clamp((b - a) / 2, 0, 15)];
}
function townLoop() {
  if (!TOWN.open) return;
  const a = TOWN.anim;
  if (a) {
    const k = clamp((performance.now() - a.t0) / 450, 0, 1), e = 1 - Math.pow(1 - k, 3);
    TOWN.z = lerp(a.from.z, a.to.z, e); TOWN.ox = lerp(a.from.ox, a.to.ox, e); TOWN.oy = lerp(a.from.oy, a.to.oy, e);
    if (k >= 1) { TOWN.anim = null; if (a.done) a.done(); }
  }
  drawTown(); if (TOWN.open) TOWN.raf = requestAnimationFrame(townLoop);
}
/* Glide the view to a target (zoom and offset) and then run done. */
function townGlide(to, done) { TOWN.anim = { t0: performance.now(), from: { z: TOWN.z, ox: TOWN.ox, oy: TOWN.oy }, to, done }; }
/* Glide in on a grid point. */
function townFocus(at) {
  const r = $('tcv').getBoundingClientRect(), [cx, cy] = tiso(...at), z = .65;
  townGlide({ z, ox: r.width / 2 - cx * z, oy: r.height * .55 - cy * z });
}
/* Keep the town on screen however far you drag. */
function townClamp(w, h) {
  const c = tiso(7.5, 7.5), sx = c[0] * TOWN.z + TOWN.ox, sy = c[1] * TOWN.z + TOWN.oy, mx = 8 * TW / 2 * TOWN.z, my = 8 * TH / 2 * TOWN.z;
  TOWN.ox += clamp(sx, Math.min(w * .5, -mx + w * .2), Math.max(w * .5, w * .8 + mx)) - sx;
  TOWN.oy += clamp(sy, Math.min(h * .5, h * .3 - my), Math.max(h * .55, h * .8 + my)) - sy;
}
/* Zoom into the home screen's town: start from exactly what the home shows, fade the rest of the screen away
   and glide in on the tapped spot. Zooming back out (pinch, wheel or the X) returns to the home screen. */
function openTown(at) {
  const el = $('town'); el.hidden = false; TOWN.open = true; TOWN.leaving = false;
  TOWN.z = HOME.z; TOWN.ox = HOME.ox; TOWN.oy = HOME.oy; TOWN.anim = null;
  $('tClose').classList.remove('gone');
  requestAnimationFrame(() => el.classList.add('on'));
  cancelAnimationFrame(TOWN.raf); townLoop();
  townFocus(at || [7, 8]);
}
function closeTown() {
  if (!TOWN.open || TOWN.leaving) return;
  TOWN.leaving = true; $('tClose').classList.add('gone');
  townGlide({ z: HOME.z, ox: HOME.ox, oy: HOME.oy }, () => {
    $('town').classList.remove('on');
    setTimeout(() => { TOWN.open = false; TOWN.leaving = false; $('town').hidden = true; cancelAnimationFrame(TOWN.raf); refresh(); }, 250);
  });
}
function inPoly(p, pts) { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j]; if ((yi > p[1]) !== (yj > p[1]) && p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi) c = !c; } return c; }
function townTap(x, y) {
  const zh = (TOWN.zoneHits || []).find(hh => inPoly([x, y], hh.pts));
  if (zh) { sfx('click'); townFocus(zh.zn.at); return; }
  const hit = TOWN.hits.slice().sort((a, b) => b.depth - a.depth).find(hh => inPoly([x, y], hh.pts) || (x > hh.box[0] && x < hh.box[2] && y > hh.box[1] && y < hh.box[3]));
  if (hit) { sfx('click'); hit.b.tap(); }
}
(function townInput() {
  const cvs = $('tcv');
  const pos = e => { const r = cvs.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const zoomAt = (px, py, k) => {
    if (TOWN.leaving) return;
    TOWN.anim = null; const z = clamp(TOWN.z * k, HOME.z, 1.6); k = z / TOWN.z; TOWN.ox = px - (px - TOWN.ox) * k; TOWN.oy = py - (py - TOWN.oy) * k; TOWN.z = z;
    if (z <= HOME.z * 1.04) { TOWN.pinch = null; closeTown(); }
  };
  cvs.addEventListener('pointerdown', e => { cvs.setPointerCapture(e.pointerId); TOWN.ptrs.set(e.pointerId, pos(e)); if (TOWN.ptrs.size === 1) TOWN.down = { p: pos(e), t: performance.now(), moved: 0 }; else TOWN.down = null; });
  cvs.addEventListener('pointermove', e => {
    if (!TOWN.ptrs.has(e.pointerId)) return;
    const prev = TOWN.ptrs.get(e.pointerId), cur = pos(e); TOWN.ptrs.set(e.pointerId, cur);
    if (TOWN.leaving) return;
    if (TOWN.ptrs.size === 1) { TOWN.anim = null; TOWN.ox += cur[0] - prev[0]; TOWN.oy += cur[1] - prev[1]; if (TOWN.down) TOWN.down.moved += Math.hypot(cur[0] - prev[0], cur[1] - prev[1]); }
    else if (TOWN.ptrs.size === 2) {
      const [a, b] = [...TOWN.ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (TOWN.pinch) zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, d / TOWN.pinch);
      TOWN.pinch = d;
    }
  });
  const up = e => {
    if (TOWN.down && TOWN.ptrs.size === 1 && TOWN.down.moved < 10 && performance.now() - TOWN.down.t < 500) townTap(...pos(e));
    TOWN.ptrs.delete(e.pointerId); if (TOWN.ptrs.size < 2) TOWN.pinch = null; if (!TOWN.ptrs.size) TOWN.down = null;
  };
  cvs.addEventListener('pointerup', up); cvs.addEventListener('pointercancel', up);
  cvs.addEventListener('wheel', e => { e.preventDefault(); const p = pos(e); zoomAt(p[0], p[1], e.deltaY < 0 ? 1.1 : 1 / 1.1); }, { passive: false });
  $('tClose').onclick = closeTown;
})();

/* ---------- boot ---------- */
$('go').onclick = () => { if (S.weather.flag === 'red' && flying().length) confirmRed(); else startCollect(); };
$('skip').onclick = () => launch(true);
let psBase = null;
function priceSheet(open) { $('psheet').hidden = !open; $('dock').style.visibility = open ? 'hidden' : ''; psBase = null; if (open) { renderAct(); psBase = estIncome(); renderAct(); } else { save(); refresh(); } }
$('pcard').onclick = () => priceSheet(true);
$('psOk').onclick = $('psClose').onclick = () => priceSheet(false);
$('psheet').addEventListener('click', e => { if (e.target.id === 'psheet') priceSheet(false); });
$('bMenu').onclick = showMenu;
$('pClose').onclick = closePage;
$('abort').onclick = confirmAbort;
$('hRep').onclick = () => { if (mode === 'office' && $('report').hidden) showRepChart(); };
$('hCash').onclick = () => { if (mode === 'office' && $('report').hidden) openPage('bank'); };
holdRepeat($('pMinus'), -5); holdRepeat($('pPlus'), 5);
window.addEventListener('resize', () => { if (mode === 'office') placeWidgets(); });
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now; T += dt;
  if (mode === 'flight') updateFlight(dt);
  if (mode === 'intro') updateIntro(dt);
  if (mode === 'collect') updateCollect(dt);
  if (mode === 'collect' && !crowdNode) crowd(true);
  if (mode !== 'collect' && crowdNode) crowd(false);
  const wantBurn = (mode === 'intro' && INTRO.hold && !INTRO.out) || (mode === 'flight' && FL && FL.burning && FL.fuel > 0 && !FL.done);
  if (wantBurn !== burnState) { burnState = wantBurn; burner(wantBurn); }
  if (mode === 'intro' || mode === 'setup' || mode === 'pick') drawIntro(dt); else draw(dt);
  if (S) updateChirp(dt);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize();
S = load();
if (!S || !S.balloons || !S.balloons.length || S.over) S = newState(); else S = migrate(S);
applyRegionTheme();
startIntro();
requestAnimationFrame(frame);
</script>
