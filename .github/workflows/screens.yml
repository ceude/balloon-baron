name: Screens

# Runs the app on an iPhone and an iPad simulator (Xcode 15.2) and saves screenshots of a few screens, both as
# the run's "screens" artifact and on the `ci-screens` branch (replaced each run), so layouts can be checked
# without a Mac. The app sets itself up from launch
# arguments (BalloonBaron/DemoSetup.swift, debug builds only). Run it from the Actions tab, or it runs when
# the app changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['BalloonBaron/**', 'Packages/**', '.github/workflows/screens.yml']

permissions:
  contents: write

jobs:
  screens:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build for the simulator
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app
          xcodebuild build -project BalloonBaron.xcodeproj -scheme BalloonBaron -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { tail -n 60 build.log; exit 1; }
      - name: Screenshots
        shell: bash
        run: |
          set +e
          APP=dd/Build/Products/Debug-iphonesimulator/BalloonBaron.app
          RUNTIME=$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*' | tail -n 1)
          echo "runtime $RUNTIME"
          PHONE=$(xcrun simctl list devicetypes | grep -o 'com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro-Max' | head -n 1)
          IPAD=$(xcrun simctl list devicetypes | grep -o 'com.apple.CoreSimulator.SimDeviceType.iPad-Pro-12-9-inch-6th-generation[^)]*' | head -n 1)
          [ -z "$IPAD" ] && IPAD=$(xcrun simctl list devicetypes | grep -o 'com.apple.CoreSimulator.SimDeviceType.iPad-Pro[^)]*' | tail -n 1)
          echo "phone $PHONE / ipad $IPAD"
          mkdir -p shots
          for DEV in "$PHONE" "$IPAD"; do
            UDID=$(xcrun simctl create shots "$DEV" "$RUNTIME")
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b > /dev/null
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$UDID" "$APP"
            TAG=$(echo "$DEV" | sed 's/.*SimDeviceType\.//' | tr -cd '[:alnum:]-')
            while IFS='|' read -r NAME ARGS WAIT; do
              [ -z "$NAME" ] && continue
              # simctl reads stdin; keep it away from the scene list
              xcrun simctl launch "$UDID" com.ceude.balloonbaron $ARGS < /dev/null > /dev/null
              sleep "$WAIT"
              xcrun simctl io "$UDID" screenshot "shots/$TAG-$NAME.png" < /dev/null > /dev/null
              if ! xcrun simctl spawn "$UDID" launchctl list < /dev/null | grep -q com.ceude.balloonbaron; then echo "::warning::$TAG $NAME: the app is not running (crash?)"; fi
              xcrun simctl terminate "$UDID" com.ceude.balloonbaron < /dev/null || true
            done <<'LIST'
          intro|-demoDays 30 -demoIntro|6
          home|-demoDays 60|9
          fleet|-demoDays 60 -demoPage fleet|8
          market|-demoDays 60 -demoPage market|8
          goals|-demoDays 60 -demoPage goals|8
          abq|-demoDays 60 -demoRegion abq|10
          lux|-demoDays 60 -demoRegion lux|12
          luxintro|-demoDays 60 -demoRegion lux -demoIntro|8
          holding|-demoDays 60 -demoRegion lux -demoPage holding|9
          hqdesks|-demoDays 60 -demoRegion lux -demoHolding jersey -demoPage holding|9
          hqdeals|-demoDays 60 -demoRegion lux -demoHolding deals -demoPage holding -demoUnit deals|10
          hqjersey|-demoDays 60 -demoRegion lux -demoHolding jersey -demoPage holding -demoUnit deals|10
          crew|-demoDays 60 -demoPage crew|8
          bank|-demoDays 60 -demoPage bank|8
          map|-demoDays 60 -demoRegion abq -demoPage map|9
          abqfleet|-demoDays 60 -demoRegion abq -demoPage fleet|9
          issue|-demoDays 60 -demoScene issue|12
          collect|-demoDays 60 -demoScene collect|11
          album|-demoDays 60 -demoScene album|8
          deal|-demoDays 60 -demoScene deal|8
          LIST
            xcrun simctl shutdown "$UDID"
          done
          ls -la shots
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: shots
      - name: Put the pictures on the ci-screens branch
        if: always()
        shell: bash
        run: |
          cd shots
          git init -q -b ci-screens
          git config user.name "screens-bot"
          git config user.email "screens-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Screens for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screens
