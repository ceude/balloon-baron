name: Screens

# Runs the app on an iPhone and an iPad simulator (Xcode 15.2) and saves screenshots of a few screens as the
# run's "screens" artifact, so layouts can be checked without a Mac. The app sets itself up from launch
# arguments (BalloonBaron/DemoSetup.swift, debug builds only). Run it from the Actions tab, or it runs when
# the app changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['BalloonBaron/**', 'Packages/**', '.github/workflows/screens.yml']

jobs:
  screens:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build for the simulator
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app
          xcodebuild build -project BalloonBaron.xcodeproj -scheme BalloonBaron -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { tail -n 60 build.log; exit 1; }
      - name: Screenshots
        shell: bash
        run: |
          APP=dd/Build/Products/Debug-iphonesimulator/BalloonBaron.app
          RUNTIME=$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*' | tail -n 1)
          echo "runtime $RUNTIME"
          IPAD=$(xcrun simctl list devicetypes | grep -o 'iPad Pro (12.9-inch)[^(]*([0-9a-z]* generation)' | tail -n 1)
          mkdir -p shots
          for DEV in "iPhone 15 Pro Max" "$IPAD"; do
            UDID=$(xcrun simctl create shots "$DEV" "$RUNTIME")
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b > /dev/null
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$UDID" "$APP"
            TAG=$(echo "$DEV" | tr -cd '[:alnum:]')
            while IFS='|' read -r NAME ARGS WAIT; do
              [ -z "$NAME" ] && continue
              xcrun simctl launch "$UDID" com.ceude.balloonbaron $ARGS > /dev/null
              sleep "$WAIT"
              xcrun simctl io "$UDID" screenshot "shots/$TAG-$NAME.png" > /dev/null
              if ! xcrun simctl spawn "$UDID" launchctl list | grep -q com.ceude.balloonbaron; then echo "::warning::$TAG $NAME: the app is not running (crash?)"; fi
              xcrun simctl terminate "$UDID" com.ceude.balloonbaron || true
            done <<'LIST'
          intro|-demoDays 30 -demoIntro|6
          home|-demoDays 60|9
          fleet|-demoDays 60 -demoPage fleet|8
          market|-demoDays 60 -demoPage market|8
          goals|-demoDays 60 -demoPage goals|8
          abq|-demoDays 60 -demoRegion abq|10
          LIST
            xcrun simctl shutdown "$UDID"
          done
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: shots
