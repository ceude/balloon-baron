name: CI

# Every push checks what the developer's Mac will see: the core's tests on Swift 5.9,
# and the whole iOS app built with Xcode 15.2 (no signing). Errors go to the run's summary page.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
      - name: Test BalloonBaronCore
        working-directory: Packages/BalloonBaronCore
        shell: bash
        run: |
          set +e
          swift test > test.log 2>&1
          status=$?
          {
            echo "## Core tests (Swift 5.9): $([ $status = 0 ] && echo passed || echo FAILED)"
            echo '```'
            grep -E "error:|failed|Executed [0-9]+ tests" test.log | sort -u | head -n 120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 test.log
          exit $status

  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build the app with Xcode 15.2 for the simulator
        shell: bash
        run: |
          set +e
          sudo xcode-select -s /Applications/Xcode_15.2.app
          xcodebuild build -project BalloonBaron.xcodeproj -scheme BalloonBaron \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          {
            echo "## App build: $([ $status = 0 ] && echo passed || echo FAILED)"
            echo '```'
            xcodebuild -version
            grep -E "^/.*(error|warning): " build.log | sed 's|.*/BalloonBaron/||' | sort -u | grep -v "warning: .*is deprecated" | head -n 150
            grep -E "BUILD (SUCCEEDED|FAILED)" build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Errors also as annotations, readable through the API when logs can't be downloaded.
          grep -E "^/.*error: " build.log | sed 's|.*/BalloonBaron/||' | sort -u | head -n 40 | while IFS= read -r l; do echo "::error::$l"; done
          tail -n 40 build.log
          exit $status

  # App Store Connect only takes uploads built with Xcode 26 (iOS 26 SDK), so Xcode Cloud archives with the newest
  # Xcode. This builds the app the same way here (device, Release, no signing) to catch what the newer compiler rejects.
  app-xcode26:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the app with the newest Xcode for a device (Release)
        shell: bash
        run: |
          set +e
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$X"
          xcodebuild build -project BalloonBaron.xcodeproj -scheme BalloonBaron -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          {
            echo "## App build, newest Xcode: $([ $status = 0 ] && echo passed || echo FAILED)"
            echo '```'
            xcodebuild -version
            grep -E "^/.*(error|warning): " build.log | sed 's|.*/BalloonBaron/||' | sort -u | grep -v "warning: .*is deprecated" | head -n 150
            grep -E "BUILD (SUCCEEDED|FAILED)" build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^/.*error: " build.log | sed 's|.*/BalloonBaron/||' | sort -u | head -n 40 | while IFS= read -r l; do echo "::error::$l"; done
          tail -n 40 build.log
          exit $status
